name: Temporary PR63 patch

on:
  push:
    branches:
      - feat/12-playlist-cover-upload
    paths:
      - .github/scripts/tmp_patch_63.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/12-playlist-cover-upload
      - run: python .github/scripts/tmp_patch_63.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/news_bulletin_playlist/managed_admin_web.py \
                  src/news_bulletin_playlist/spotify/client.py
          git diff --cached --quiet && exit 0
          git commit -m "style: clean cover upload implementation"
          git push origin HEAD:feat/12-playlist-cover-upload
