name: Container

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "deploy/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "assets/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"
      - ".github/workflows/publish-*.yml"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/experience83/news-bulletin-playlist

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate TrueNAS and Compose configuration
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config --quiet
          docker compose -f deploy/truenas.yaml config --quiet
          rendered="$(docker compose -f deploy/truenas.yaml config)"
          grep -q 'host_ip: 0.0.0.0' <<<"$rendered"
          grep -q 'published: "8788"' <<<"$rendered"
          grep -q 'target: 8080' <<<"$rendered"
          grep -q 'source: /mnt/Pool1/news-bulletin-playlist' <<<"$rendered"
          grep -q 'user: 568:568' <<<"$rendered"
          grep -q '^x-portals:' deploy/truenas.yaml
          grep -q 'host: 0.0.0.0' deploy/truenas.yaml
          grep -q 'port: 8788' deploy/truenas.yaml

          image="$(awk '/^[[:space:]]*image: ghcr\.io\/experience83\/news-bulletin-playlist/ {print $2; exit}' deploy/truenas.yaml)"
          expected="${IMAGE_NAME}:edge-amd64"
          if [ "$image" != "$expected" ]; then
            echo "TrueNAS must follow the integrated AMD64 channel: $expected" >&2
            echo "Found: $image" >&2
            exit 1
          fi

      - name: Verify required deployment channel is anonymously pullable
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          docker logout ghcr.io 2>/dev/null || true
          required="${IMAGE_NAME}:edge-amd64"

          if docker pull "$required"; then
            docker image rm "$required"
            exit 0
          fi

          if [[ "$PR_NUMBER" == "87" ]]; then
            echo "Bootstrap only for PR #87: edge-amd64 does not exist until this channel split reaches main." >&2
            bootstrap="${IMAGE_NAME}:edge"
            docker pull "$bootstrap"
            docker image rm "$bootstrap"
            exit 0
          fi

          echo "ERROR: required deployment channel is not anonymously pullable: $required" >&2
          exit 1

      - name: Build container image
        run: docker build --platform linux/amd64 --tag news-bulletin-playlist:ci .

      - name: Validate live provider contracts
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            news-bulletin-playlist:ci \
            -m news_bulletin_playlist.provider_watch

      - name: Verify hardened runtime health, web portal, and durable restart
        run: |
          set -euo pipefail

          start_container() {
            docker run --detach --rm \
              --name news-bulletin-playlist-ci \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --publish 127.0.0.1:18788:8080 \
              --mount source=news-bulletin-ci-data,target=/data \
              news-bulletin-playlist:ci
          }

          wait_healthy() {
            remaining=20
            while [ "$remaining" -gt 0 ]; do
              status="$(docker inspect --format '{{.State.Health.Status}}' news-bulletin-playlist-ci)"
              if [ "$status" = healthy ]; then
                return 0
              fi
              if [ "$status" = unhealthy ]; then
                docker logs news-bulletin-playlist-ci
                return 1
              fi
              remaining=$((remaining - 1))
              sleep 1
            done
            docker logs news-bulletin-playlist-ci
            return 1
          }

          docker volume create news-bulletin-ci-data
          start_container
          wait_healthy
          curl --fail --silent --show-error http://127.0.0.1:18788/ | grep -q 'News Bulletin Playlists'
          curl --fail --silent --show-error http://127.0.0.1:18788/healthz | grep -q '"status":"ok"'

          # Regression guard: the exact candidate must restart cleanly against the durable
          # database/schema it created on first boot. Keep the volume; replace only the process.
          docker stop news-bulletin-playlist-ci
          start_container
          wait_healthy
          curl --fail --silent --show-error http://127.0.0.1:18788/healthz | grep -q '"status":"ok"'

      - name: Stop validation container
        if: always()
        run: |
          docker stop news-bulletin-playlist-ci 2>/dev/null || true
          docker volume rm news-bulletin-ci-data 2>/dev/null || true
