name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "deploy/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "deploy/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/experience83/news-bulletin-playlist

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate TrueNAS and Compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f deploy/truenas.yaml config --quiet
          rendered="$(docker compose -f deploy/truenas.yaml config)"
          grep -q 'published: "8788"' <<<"$rendered"
          grep -q 'target: 8080' <<<"$rendered"
          grep -q '^x-portals:' deploy/truenas.yaml
          grep -q 'port: 8788' deploy/truenas.yaml
      - name: Verify TrueNAS image is anonymously pullable
        run: |
          image="$(awk '/^[[:space:]]*image: ghcr\.io\/experience83\/news-bulletin-playlist@sha256:/ {print $2; exit}' deploy/truenas.yaml)"
          test -n "$image"
          docker logout ghcr.io 2>/dev/null || true
          docker pull "$image"
          docker image rm "$image"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: news-bulletin-playlist:ci
      - name: Verify hardened runtime health and web portal
        run: |
          docker volume create news-bulletin-ci-data
          docker run --detach --rm \
            --name news-bulletin-playlist-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18788:8080 \
            --mount source=news-bulletin-ci-data,target=/data \
            news-bulletin-playlist:ci
          for attempt in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' news-bulletin-playlist-ci)
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              docker logs news-bulletin-playlist-ci
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' news-bulletin-playlist-ci)" = healthy
          test "$(docker inspect --format '{{.Config.User}}' news-bulletin-playlist-ci)" = "10001:10001"
          curl --fail --silent --show-error http://127.0.0.1:18788/ | grep -q 'News Bulletin Playlists'
          curl --fail --silent --show-error http://127.0.0.1:18788/healthz | grep -q '"status":"ok"'
      - name: Stop validation container
        if: always()
        run: |
          docker stop news-bulletin-playlist-ci 2>/dev/null || true
          docker volume rm news-bulletin-ci-data 2>/dev/null || true

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f deploy/truenas.yaml config --quiet
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
