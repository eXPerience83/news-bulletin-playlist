name: Temporary PR63 mypy fix

on:
  push:
    branches:
      - feat/12-playlist-cover-upload
    paths:
      - .github/scripts/tmp_pr63_mypy_fix.py
      - .github/workflows/tmp-pr63-mypy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/12-playlist-cover-upload
      - run: python .github/scripts/tmp_pr63_mypy_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/news_bulletin_playlist/spotify/auth.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: type optional Spotify cover scopes"
          git push origin HEAD:feat/12-playlist-cover-upload
