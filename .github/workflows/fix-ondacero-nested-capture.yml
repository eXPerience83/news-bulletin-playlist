name: Apply Onda Cero nested-title fix

on:
  push:
    branches:
      - fix/codex-ondacero-nested-title

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/codex-ondacero-nested-title
      - name: Emit only outermost supported title unit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/news_bulletin_playlist/provider_watch.py')
          text = path.read_text()
          old = '''            self._captures.pop(index)\n            text = " ".join("".join(parts).split()).strip()\n            if text:\n                self.titles.append(text)\n            break\n'''
          new = '''            self._captures.pop(index)\n            # Nested supported tags are formatting fragments of the enclosing title unit.\n            # Their text is already accumulated into every active ancestor capture, so emitting\n            # the nested fragment independently could make a promotional/suffixed headline pass\n            # the provider-watch ratio using text that never existed as a complete title.\n            if self._captures:\n                break\n            text = " ".join("".join(parts).split()).strip()\n            if text:\n                self.titles.append(text)\n            break\n'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: pip install ruff==0.16.8
      - run: ruff format src/news_bulletin_playlist/provider_watch.py tests/test_provider_watch_title_recovery.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/news_bulletin_playlist/provider_watch.py tests/test_provider_watch_title_recovery.py
          git commit -m "Keep nested fallback fragments inside complete title units"
          git push origin HEAD:fix/codex-ondacero-nested-title
