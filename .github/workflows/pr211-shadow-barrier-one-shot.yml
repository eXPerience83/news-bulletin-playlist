name: PR211 shadow barrier one-shot

on:
  push:
    branches:
      - fix/209-ambiguous-evidence-duration

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/209-ambiguous-evidence-duration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Apply shadow-barrier correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path("src/news_bulletin_playlist/engine.py")
          text = engine.read_text()

          old = '''                    self._observe_matching_result(source, match_result, matching_now)\n'''
          new = '''                    self._observe_matching_result(\n                        source,\n                        match_result,\n                        matching_now,\n                        evaluation_intents=plan.evaluation_intents,\n                    )\n'''
          if text.count(old) != 1:
              raise RuntimeError("expected main matching observation call exactly once")
          text = text.replace(old, new, 1)

          old = '''                self._observe_matching_result(source, result, observed_at)\n                if result.persistence_rejected:\n'''
          new = '''                self._observe_matching_result(\n                    source,\n                    result,\n                    observed_at,\n                    evaluation_intents={\n                        edition.identity: MatchEvaluationIntent.SEMANTIC_REEVALUATION\n                    },\n                )\n                if result.persistence_rejected:\n'''
          if text.count(old) != 1:
              raise RuntimeError("expected prewrite matching observation call exactly once")
          text = text.replace(old, new, 1)

          old = '''    def _observe_matching_result(\n        self,\n        source: SourceDefinition,\n        result: SourceMatchResult,\n        observed_at: datetime,\n    ) -> None:\n'''
          new = '''    def _observe_matching_result(\n        self,\n        source: SourceDefinition,\n        result: SourceMatchResult,\n        observed_at: datetime,\n        *,\n        evaluation_intents: Mapping[tuple[SourceId, str], MatchEvaluationIntent] | None = None,\n    ) -> None:\n'''
          if text.count(old) != 1:
              raise RuntimeError("expected observe matching signature exactly once")
          text = text.replace(old, new, 1)

          old = '''            for outcome in result.outcomes:\n                edition = outcome.edition\n                input_fingerprint = matching_input_fingerprint(source, edition)\n                if outcome.persistence_rejected:\n'''
          new = '''            for outcome in result.outcomes:\n                edition = outcome.edition\n                input_fingerprint = matching_input_fingerprint(source, edition)\n                explicit_evaluation = bool(\n                    evaluation_intents is not None\n                    and edition.identity in evaluation_intents\n                )\n                rejection_barrier = self._edition_has_persistence_rejection_barrier(\n                    source, edition\n                )\n                if outcome.persistence_rejected:\n'''
          if text.count(old) != 1:
              raise RuntimeError("expected outcome observation prologue exactly once")
          text = text.replace(old, new, 1)

          old = '''                elif outcome.planner_input_evidence_qualified is False:\n                    self.planner_journal.clear_match_input(\n                        str(edition.source_id), edition.source_native_id\n                    )\n                    self.planner_journal.clear_matched_recovery(\n                        str(edition.source_id), edition.source_native_id\n                    )\n'''
          new = '''                elif outcome.planner_input_evidence_qualified is False:\n                    self.planner_journal.clear_match_input(\n                        str(edition.source_id), edition.source_native_id\n                    )\n                    # A shadow-only contradiction can invalidate positive match-input evidence,\n                    # but it did not attempt the repair whose temporal rejection created the\n                    # durable destination barrier. Preserve that barrier until an explicit\n                    # evaluation resolves it.\n                    if explicit_evaluation or not rejection_barrier:\n                        self.planner_journal.clear_matched_recovery(\n                            str(edition.source_id), edition.source_native_id\n                        )\n'''
          if text.count(old) != 1:
              raise RuntimeError("expected negative qualification branch exactly once")
          text = text.replace(old, new, 1)

          old = '''                        if prior_input is None:\n                            self.planner_journal.record_matched_recovery(\n                                source_id=str(edition.source_id),\n                                source_native_id=edition.source_native_id,\n                                input_fingerprint=input_fingerprint,\n                                attempted_at=observed_at,\n                            )\n'''
          new = '''                        if prior_input is None and not (\n                            rejection_barrier and not explicit_evaluation\n                        ):\n                            self.planner_journal.record_matched_recovery(\n                                source_id=str(edition.source_id),\n                                source_native_id=edition.source_native_id,\n                                input_fingerprint=input_fingerprint,\n                                attempted_at=observed_at,\n                            )\n'''
          if text.count(old) != 1:
              raise RuntimeError("expected inconclusive recovery branch exactly once")
          text = text.replace(old, new, 1)
          engine.write_text(text)

          tests = Path("tests/test_pr211_persistence_rejection_barriers.py")
          text = tests.read_text()
          old = '''    _rss,\n    _source,\n'''
          new = '''    _rss,\n    _rss_two,\n    _source,\n'''
          if text.count(old) != 1:
              raise RuntimeError("expected test_engine import block exactly once")
          text = text.replace(old, new, 1)

          marker = '''from test_spotify_matcher import _source as _matcher_source\n'''
          insertion = '''from test_spotify_matcher import _source as _matcher_source\nfrom test_shadow_planner_review import setup\n'''
          if text.count(marker) != 1:
              raise RuntimeError("expected matcher source import exactly once")
          text = text.replace(marker, insertion, 1)

          addition = r'''


def test_shared_catalogue_preserves_rejected_repair_barrier(tmp_path: Path) -> None:
    spotify = _RollbackReplacementSpotify()
    runner, spotify, _, _ = setup(tmp_path, spotify=spotify)

    runner.clock = lambda: NOW + timedelta(hours=4)
    assert runner.run_cycle().ok

    runner.clock = lambda: NOW
    runner.planner_journal.clear_match_input("ser", "ser-1")
    runner.planner_journal.mark_destination_unknown("first")
    spotify.items["destination-first"] = []
    spotify.replacement_catalogue = True
    spotify.include_invalid_cached = True

    rejected = runner.run_cycle()
    assert not rejected.ok
    recovery = runner.planner_journal.get_matched_recovery("ser", "ser-1")
    assert recovery is not None
    assert recovery.next_retry_at == NOW + timedelta(hours=6)
    writes_before = tuple(spotify.replacements)
    calls_after_rejection = spotify.show_calls

    # A different native asset legitimately wakes the shared show catalogue while A remains
    # inside its persistence-rejection backoff. A receives shadow qualification only: that may
    # clear stale positive evidence, but must not clear or rebase the rejection barrier.
    runner.clock = lambda: NOW + timedelta(minutes=10)
    runner.fetcher = lambda _url: _rss_two()
    shared = runner.run_cycle()

    durable = runner.store.get_match_state(SourceId("ser"), "ser-1")
    assert durable is not None
    assert durable.status is MatchStatus.MATCHED
    assert durable.spotify_episode_uri == SER_URI
    assert durable.updated_at == NOW + timedelta(hours=4)
    assert runner.planner_journal.get_match_input("ser", "ser-1") is None
    assert runner.planner_journal.get_matched_recovery("ser", "ser-1") == recovery
    assert tuple(spotify.replacements) == writes_before
    assert spotify.show_calls == calls_after_rejection + 2
    assert not shared.ok

    # The shadow inspection must not turn the next quiet scheduler cycle into an early recovery.
    runner.clock = lambda: NOW + timedelta(minutes=20)
    quiet = runner.run_cycle()
    assert not quiet.ok
    assert spotify.show_calls == calls_after_rejection + 2
    assert tuple(spotify.replacements) == writes_before
    assert runner.planner_journal.get_matched_recovery("ser", "ser-1") == recovery
'''
          if "def test_shared_catalogue_preserves_rejected_repair_barrier" in text:
              raise RuntimeError("shared catalogue barrier test already exists")
          tests.write_text(text + addition)
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Normalize correction
        run: |
          ruff check --fix src/news_bulletin_playlist/engine.py tests/test_pr211_persistence_rejection_barriers.py
          ruff format src/news_bulletin_playlist/engine.py tests/test_pr211_persistence_rejection_barriers.py
      - name: Validate focused regressions
        run: |
          pytest -q tests/test_pr211_persistence_rejection_barriers.py
          pytest -q tests/test_pr211_adversarial_regressions.py tests/test_matched_evidence_recovery_repairs.py
      - name: Validate full suite
        run: |
          ruff check .
          ruff format --check .
          mypy src
          pytest
      - name: Commit correction
        run: |
          rm .github/workflows/pr211-shadow-barrier-one-shot.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '14957082+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve rejected repair barrier during shadow evaluation'
          git push origin HEAD:fix/209-ambiguous-evidence-duration
