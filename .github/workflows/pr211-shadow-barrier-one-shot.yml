name: PR211 shadow barrier one-shot

on:
  push:
    branches:
      - fix/209-ambiguous-evidence-duration

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/209-ambiguous-evidence-duration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Apply shadow-barrier correction
        run: |
          python .pr211_shadow_barrier_apply.py
          rm .pr211_shadow_barrier_apply.py
          rm .github/workflows/pr211-shadow-barrier-one-shot.yml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Normalize correction
        run: |
          ruff check --fix src/news_bulletin_playlist/engine.py tests/test_pr211_persistence_rejection_barriers.py
          ruff format src/news_bulletin_playlist/engine.py tests/test_pr211_persistence_rejection_barriers.py
      - name: Validate focused regressions
        run: |
          pytest -q tests/test_pr211_persistence_rejection_barriers.py
          pytest -q tests/test_pr211_adversarial_regressions.py tests/test_matched_evidence_recovery_repairs.py
      - name: Validate full suite
        run: |
          ruff check .
          ruff format --check .
          mypy src
          pytest
      - name: Commit correction
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '14957082+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve rejected repair barrier during shadow evaluation'
          git push origin HEAD:fix/209-ambiguous-evidence-duration
