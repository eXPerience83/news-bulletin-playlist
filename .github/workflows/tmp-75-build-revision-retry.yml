name: Temporary build revision patch retry

on:
  push:
    branches:
      - feat/75-show-build-revision

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/75-show-build-revision
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]'
      - name: Reapply patch from helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-75-build-revision.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(script, 'tmp-75-build-revision.yml', 'exec'))
          PY
      - name: Format and validate
        run: |
          python scripts/ruff_fix.py
          ruff check .
          ruff format --check .
          mypy src
          pytest -q tests/test_build_revision.py tests/test_diagnostics_web.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile src/news_bulletin_playlist/build_info.py src/news_bulletin_playlist/diagnostics_runtime.py src/news_bulletin_playlist/diagnostics_web.py tests/test_build_revision.py .github/workflows/publish-pr-candidate-amd64.yml .github/workflows/publish-edge-amd64.yml .github/workflows/publish-stable-amd64.yml
          git commit -m 'feat(status): expose running build revision'
          git push origin HEAD:feat/75-show-build-revision
