name: PR63 review fixes

on:
  push:
    branches:
      - feat/12-playlist-cover-upload

permissions:
  contents: write

jobs:
  patch-test-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/12-playlist-cover-upload
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply review fixes and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {text.count(old)}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "src/news_bulletin_playlist/engine_runtime.py",
              '''        try:\n            configuration_changed = path != "/admin/playlists/sync"\n            with synchronization.hold():\n                if path == "/admin/playlists/activate":\n                    self._activate_managed_playlist(service, form)\n                elif path == "/admin/playlists/update":\n                    self._update_managed_playlist(service, form)\n                elif path == "/admin/playlists/sync":\n                    self._sync_managed_playlist(service, form)\n                else:\n                    service.stop_managing(playlist_id_from_form(form))\n                configured = any(playlist.enabled for playlist in service.snapshot().managed)\n            if configuration_changed:\n                lifecycle.reconcile(configured=configured)\n                self.__class__.engine_scheduler = lifecycle.scheduler\n''',
              '''        try:\n            if path == "/admin/playlists/sync":\n                with synchronization.hold():\n                    playlist_id = playlist_id_from_form(form)\n                    if not any(\n                        playlist.id == playlist_id for playlist in service.snapshot().managed\n                    ):\n                        raise ManagedAdminError(f"unknown managed playlist: {playlist_id}")\n                # HTTPServer serves admin requests serially. Validate immutable managed state\n                # under the configuration lock, then keep Spotify I/O outside that lock so a\n                # slow metadata/cover request cannot delay an engine cycle.\n                self._sync_managed_playlist(service, form)\n            else:\n                with synchronization.hold():\n                    if path == "/admin/playlists/activate":\n                        self._activate_managed_playlist(service, form)\n                    elif path == "/admin/playlists/update":\n                        self._update_managed_playlist(service, form)\n                    else:\n                        service.stop_managing(playlist_id_from_form(form))\n                    configured = any(playlist.enabled for playlist in service.snapshot().managed)\n                lifecycle.reconcile(configured=configured)\n                self.__class__.engine_scheduler = lifecycle.scheduler\n''',
          )

          replace_once(
              "src/news_bulletin_playlist/managed_admin.py",
              '''        if self.cover_loader is None:\n            return\n        try:\n            jpeg_bytes = self.cover_loader(cover_id)\n            client.upload_playlist_cover(playlist_id, jpeg_bytes)\n        except (OSError, ValueError, SpotifyApiError, SpotifyTransportError):\n            # Cover art is product metadata. It must never block playlist state or bulletin sync.\n            return\n''',
              '''        if self.cover_loader is None:\n            return\n        upload_playlist_cover = getattr(client, "upload_playlist_cover", None)\n        if not callable(upload_playlist_cover):\n            return\n        try:\n            jpeg_bytes = self.cover_loader(cover_id)\n            upload_playlist_cover(playlist_id, jpeg_bytes)\n        except (OSError, ValueError, SpotifyApiError, SpotifyTransportError):\n            # Cover art is product metadata. It must never block playlist state or bulletin sync.\n            return\n''',
          )

          replace_once(
              "tests/test_playlist_cover_upload.py",
              '''import base64\nimport urllib.request\nfrom pathlib import Path\n''',
              '''import base64\nimport urllib.error\nimport urllib.request\nfrom http.client import HTTPMessage\nfrom pathlib import Path\n''',
          )
          replace_once(
              "tests/test_playlist_cover_upload.py",
              '''from news_bulletin_playlist.spotify.client import SpotifyApiError, SpotifyClient\n''',
              '''from news_bulletin_playlist.spotify.client import (\n    SpotifyApiError,\n    SpotifyClient,\n    SpotifyTransportError,\n)\n''',
          )
          replace_once(
              "tests/test_playlist_cover_upload.py",
              '''class _Factory:\n''',
              '''class _CoverlessClient:\n    def create_private_playlist(self, name: str, *, description: str = "") -> dict[str, Any]:\n        del name, description\n        return {"id": "destination"}\n\n    def change_playlist_details(\n        self,\n        playlist_id: str,\n        *,\n        name: str,\n        description: str,\n    ) -> dict[str, Any]:\n        del playlist_id, name, description\n        return {}\n\n\nclass _Factory:\n''',
          )
          replace_once(
              "tests/test_playlist_cover_upload.py",
              '''def test_spotify_cover_upload_rejects_invalid_or_oversized_payload_before_network(\n''',
              '''@pytest.mark.parametrize(\n    ("failure_kind", "expected_exception"),\n    [\n        ("http", SpotifyApiError),\n        ("transport", SpotifyTransportError),\n    ],\n)\ndef test_spotify_cover_upload_failure_does_not_expose_access_token(\n    monkeypatch: pytest.MonkeyPatch,\n    capsys: pytest.CaptureFixture[str],\n    failure_kind: str,\n    expected_exception: type[RuntimeError],\n) -> None:\n    access_token = "access-token-sentinel"\n\n    def fake_urlopen(request: urllib.request.Request, timeout: float) -> _Response:\n        assert request.get_header("Authorization") == f"Bearer {access_token}"\n        assert timeout == 30.0\n        if failure_kind == "http":\n            raise urllib.error.HTTPError(\n                request.full_url,\n                403,\n                f"forbidden {access_token}",\n                HTTPMessage(),\n                None,\n            )\n        raise urllib.error.URLError(f"network {access_token}")\n\n    monkeypatch.setattr(urllib.request, "urlopen", fake_urlopen)\n    jpeg = b"\\xff\\xd8cover\\xff\\xd9"\n\n    with pytest.raises(expected_exception) as exc_info:\n        SpotifyClient(access_token).upload_playlist_cover("playlist-id", jpeg)\n\n    captured = capsys.readouterr()\n    assert access_token not in captured.out\n    assert access_token not in captured.err\n    assert access_token not in str(exc_info.value)\n\n\ndef test_spotify_cover_upload_rejects_invalid_or_oversized_payload_before_network(\n''',
          )
          replace_once(
              "tests/test_playlist_cover_upload.py",
              '''def test_activation_uploads_cover_after_managed_state_is_persisted(tmp_path: Path) -> None:\n''',
              '''def test_coverless_injected_client_skips_optional_cover_capability(tmp_path: Path) -> None:\n    client = _CoverlessClient()\n    loader_called = False\n\n    def cover_loader(_cover_id: str) -> bytes:\n        nonlocal loader_called\n        loader_called = True\n        return b"\\xff\\xd8cover\\xff\\xd9"\n\n    service = ManagedAdminService(\n        ManagedStateStore(tmp_path / "managed-state.json"),\n        client_factory=lambda _token: client,  # type: ignore[arg-type]\n        cover_loader=cover_loader,\n    )\n    template = BUILTIN_CATALOG.playlist("spain_spanish_news")\n\n    managed = service.activate(\n        template_id=template.id,\n        display_name=template.display_name,\n        description=template.description,\n        cover_id=template.cover_id,\n        source_ids=template.default_source_ids,\n        access_token="token",\n    )\n\n    assert service.snapshot().managed == (managed,)\n    assert not loader_called\n\n\ndef test_activation_uploads_cover_after_managed_state_is_persisted(tmp_path: Path) -> None:\n''',
          )

          replace_once(
              "tests/test_playlist_cover_admin_route.py",
              '''import base64\nfrom dataclasses import dataclass\n''',
              '''import base64\nimport threading\nfrom dataclasses import dataclass\n''',
          )
          replace_once(
              "tests/test_playlist_cover_admin_route.py",
              '''    def __init__(self) -> None:\n        self.update_calls: list[tuple[str, str, str]] = []\n        self.cover_calls: list[tuple[str, bytes]] = []\n''',
              '''    def __init__(self) -> None:\n        self.update_calls: list[tuple[str, str, str]] = []\n        self.cover_calls: list[tuple[str, bytes]] = []\n        self.block_updates = False\n        self.update_started = threading.Event()\n        self.update_release = threading.Event()\n''',
          )
          replace_once(
              "tests/test_playlist_cover_admin_route.py",
              '''    ) -> dict[str, Any]:\n        self.update_calls.append((playlist_id, name, description))\n        return {}\n\n    def upload_playlist_cover''',
              '''    ) -> dict[str, Any]:\n        self.update_calls.append((playlist_id, name, description))\n        if self.block_updates:\n            self.update_started.set()\n            if not self.update_release.wait(timeout=5.0):\n                raise AssertionError("timed out waiting to release Spotify metadata update")\n        return {}\n\n    def upload_playlist_cover''',
          )
          append_marker = '''    assert lifecycle.reconcile_calls == []\n'''
          append_test = '''    assert lifecycle.reconcile_calls == []\n\n\ndef test_explicit_admin_sync_releases_configuration_lock_during_spotify_io(\n    tmp_path: Path,\n) -> None:\n    service, client, managed = _managed_service(tmp_path)\n    lifecycle = _Lifecycle()\n    provider = _Provider()\n    security = LanAdminSecurity(_PASSWORD)\n    handler = _Handler(\n        tmp_path=tmp_path,\n        service=service,\n        lifecycle=lifecycle,\n        provider=provider,\n        security=security,\n        path="/admin/playlists/sync",\n        form={\n            "csrf_token": [security.issue_csrf_token()],\n            "playlist_id": [str(managed.id)],\n        },\n    )\n    synchronization = handler.configuration_synchronization\n    assert synchronization is not None\n    client.block_updates = True\n\n    sync_thread = threading.Thread(target=handler.do_POST)\n    sync_thread.start()\n    assert client.update_started.wait(timeout=1.0)\n\n    cycle_acquired = threading.Event()\n\n    def acquire_for_engine_cycle() -> None:\n        with synchronization.hold():\n            cycle_acquired.set()\n\n    cycle_thread = threading.Thread(target=acquire_for_engine_cycle)\n    cycle_thread.start()\n    try:\n        assert cycle_acquired.wait(timeout=1.0)\n    finally:\n        client.update_release.set()\n        sync_thread.join(timeout=2.0)\n        cycle_thread.join(timeout=2.0)\n\n    assert not sync_thread.is_alive()\n    assert not cycle_thread.is_alive()\n    assert handler.response is not None\n    assert handler.response.status == HTTPStatus.SEE_OTHER\n    assert lifecycle.reconcile_calls == []\n'''
          target = Path("tests/test_playlist_cover_admin_route.py")
          text = target.read_text()
          if text.count(append_marker) != 1:
              raise SystemExit(
                  "expected exactly one scheduler assertion marker in "
                  "tests/test_playlist_cover_admin_route.py"
              )
          target.write_text(text.replace(append_marker, append_test, 1))
          PY
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr63-review-fixes.yml
          git add src/news_bulletin_playlist/engine_runtime.py \
                  src/news_bulletin_playlist/managed_admin.py \
                  tests/test_playlist_cover_upload.py \
                  tests/test_playlist_cover_admin_route.py
          git commit -m "fix: isolate playlist cover sync from engine cycles"
          git push origin HEAD:feat/12-playlist-cover-upload
