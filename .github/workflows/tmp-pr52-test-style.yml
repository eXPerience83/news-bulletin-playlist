name: Temporary PR52 test style fix

on:
  push:
    branches:
      - feat/50-admin-managed-playlists
    paths:
      - .github/workflows/tmp-pr52-test-style.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/50-admin-managed-playlists
      - run: sed -i 's/synchronization: "_TrackingSynchronization"/synchronization: _TrackingSynchronization/' tests/test_managed_admin_runtime.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_managed_admin_runtime.py
          git commit -m "test: fix lock-order regression annotation"
          git push origin HEAD:feat/50-admin-managed-playlists
