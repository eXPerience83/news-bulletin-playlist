name: Apply PR211 adversarial fixes

on:
  push:
    branches:
      - fix/209-ambiguous-evidence-duration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Apply reviewed fixes
        run: python .github/pr211_apply.py

      - name: Fix synthetic truncated-catalogue IDs
        run: |
          sed -i 's/offset + index + 1:022d/offset + index + 1000:022d/g' tests/test_engine.py

      - name: Remove one-shot patch machinery
        run: |
          rm .github/pr211_apply.py
          rm .github/workflows/pr211-apply-adversarial-fixes.yml

      - name: Format changed Python
        run: |
          ruff check --fix --select I tests/test_pr211_adversarial_regressions.py
          ruff format \
            src/news_bulletin_playlist/spotify/matcher.py \
            src/news_bulletin_playlist/engine.py \
            src/news_bulletin_playlist/spotify_planner.py \
            tests/test_engine.py \
            tests/test_pr211_adversarial_regressions.py

      - name: Validate diff whitespace
        run: git diff --check

      - name: Ruff
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest

      - name: Commit validated fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(#209): address adversarial review blockers'
          git push origin HEAD:${{ github.ref_name }}
