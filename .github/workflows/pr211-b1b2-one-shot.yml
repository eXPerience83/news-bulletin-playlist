name: PR211 persistence rejection correction

on:
  push:
    branches:
      - fix/209-ambiguous-evidence-duration
    paths:
      - .github/workflows/pr211-b1b2-one-shot.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/209-ambiguous-evidence-duration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Apply correction
        run: |
          python .pr211_b1b2_apply.py
          rm .pr211_b1b2_apply.py
          rm .pr211-b1b2.patch
          rm .github/workflows/pr211-b1b2-one-shot.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_engine.py')
          text = path.read_text()
          old = '''    clock[0] = NOW - timedelta(minutes=10)\n    rolled_back = runner.run_cycle()\n    assert rolled_back.ok\n    durable = runner.store.get_match_state(SourceId("ser"), "ser-1")\n    assert durable is not None\n    assert durable.status is MatchStatus.MATCHED\n    assert durable.spotify_episode_uri == SER_URI\n    assert runner.planner_journal.get_match_input("ser", "ser-1") is None\n    assert spotify.items["destination-first"] == [SER_URI]\n    assert tuple(spotify.replacements) == writes_before\n\n    # Once time is newer than the durable row, the same evidence-recovery path may persist B and\n    # then publish evidence for the state that is actually on disk.\n    clock[0] = NOW + timedelta(minutes=1)\n    recovered = runner.run_cycle()\n    assert recovered.ok\n    durable = runner.store.get_match_state(SourceId("ser"), "ser-1")\n    assert durable is not None\n    assert durable.status is MatchStatus.MATCHED\n    assert durable.spotify_episode_uri == replacement_uri\n    assert durable.spotify_duration_seconds == 61\n    assert runner.planner_journal.get_match_input("ser", "ser-1") is not None\n    assert spotify.items["destination-first"] == [replacement_uri]\n'''
          new = '''    clock[0] = NOW - timedelta(minutes=10)\n    rolled_back = runner.run_cycle()\n    # A rejected authoritative repair preserves the destination and marks that reconciliation unsafe.\n    assert not rolled_back.ok\n    durable = runner.store.get_match_state(SourceId("ser"), "ser-1")\n    assert durable is not None\n    assert durable.status is MatchStatus.MATCHED\n    assert durable.spotify_episode_uri == SER_URI\n    assert runner.planner_journal.get_match_input("ser", "ser-1") is None\n    recovery = runner.planner_journal.get_matched_recovery("ser", "ser-1")\n    assert recovery is not None\n    assert recovery.last_attempt_at == NOW - timedelta(minutes=10)\n    assert recovery.next_retry_at == NOW + timedelta(hours=5, minutes=50)\n    assert spotify.items["destination-first"] == [SER_URI]\n    assert tuple(spotify.replacements) == writes_before\n    calls_after_rejection = spotify.show_calls\n\n    # Merely catching up past the durable mapping timestamp must not recreate ten-minute polling.\n    # With no destination reconciliation needed, this quiet cycle may complete successfully.\n    clock[0] = NOW + timedelta(minutes=1)\n    waiting = runner.run_cycle()\n    assert waiting.ok\n    assert spotify.show_calls == calls_after_rejection\n    assert runner.store.get_spotify_episode_uri(SourceId("ser"), "ser-1") == SER_URI\n    assert runner.planner_journal.get_match_input("ser", "ser-1") is None\n    assert spotify.items["destination-first"] == [SER_URI]\n    assert tuple(spotify.replacements) == writes_before\n\n    clock[0] = recovery.next_retry_at\n    recovered = runner.run_cycle()\n    assert recovered.ok\n    durable = runner.store.get_match_state(SourceId("ser"), "ser-1")\n    assert durable is not None\n    assert durable.status is MatchStatus.MATCHED\n    assert durable.spotify_episode_uri == replacement_uri\n    assert durable.spotify_duration_seconds == 61\n    assert runner.planner_journal.get_match_input("ser", "ser-1") is not None\n    assert runner.planner_journal.get_matched_recovery("ser", "ser-1") is None\n    assert spotify.items["destination-first"] == [replacement_uri]\n'''
          if text.count(old) != 1:
              raise RuntimeError('expected original rollback regression block once')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Normalize generated correction
        run: |
          ruff check --fix src/news_bulletin_playlist/engine.py src/news_bulletin_playlist/spotify/matcher.py tests/test_engine.py tests/test_pr211_persistence_rejection_barriers.py
          ruff format src/news_bulletin_playlist/engine.py src/news_bulletin_playlist/spotify/matcher.py tests/test_engine.py tests/test_pr211_persistence_rejection_barriers.py
      - name: Validate focused regressions
        run: pytest -q tests/test_pr211_persistence_rejection_barriers.py tests/test_pr211_adversarial_regressions.py tests/test_matched_evidence_recovery_repairs.py tests/test_engine.py::test_clock_rollback_rejected_repair_never_publishes_match_input_and_recovers_later
      - name: Validate full suite
        run: |
          ruff check .
          ruff format --check .
          mypy src
          pytest
      - name: Commit correction
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '14957082+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: fail closed on rejected match persistence'
          git push origin HEAD:fix/209-ambiguous-evidence-duration
