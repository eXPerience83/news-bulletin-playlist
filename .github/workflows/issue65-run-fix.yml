name: Issue 65 run explicit sync fix

on:
  push:
    branches: [fix/spotify-explicit-sync-diagnostics]
    paths:
      - ".github/workflows/issue65-run-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/spotify-explicit-sync-diagnostics
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
      - name: Apply stored patch
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          workflow = Path('.github/workflows/issue65-explicit-sync-fix.yml').read_text()
          payload = None
          for line in workflow.splitlines():
              stripped = line.strip()
              if stripped.startswith('B64_PATCH:'):
                  payload = stripped.split(':', 1)[1].strip().strip('"')
                  break
          if not payload:
              raise SystemExit('stored patch payload not found')
          exec(base64.b64decode(payload), {'__name__': '__main__'})
          PY
      - name: Update explicit cover failure regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_playlist_cover_upload.py')
          text = path.read_text()
          old_import = 'from news_bulletin_playlist.managed_admin import ManagedAdminService, render_spotify_description\n'
          new_import = '''from news_bulletin_playlist.managed_admin import (\n    ManagedAdminService,\n    SpotifyPlaylistSyncError,\n    render_spotify_description,\n)\n'''
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import)
          old_test = '''def test_cover_failure_during_explicit_sync_does_not_fail_metadata_sync(tmp_path: Path) -> None:\n    client = _CoverClient()\n    jpeg = b"\\xff\\xd8cover\\xff\\xd9"\n    service, managed = _activate(tmp_path, client, cover_loader=lambda _cover_id: jpeg)\n    client.fail_cover = True\n    client.cover_calls.clear()\n    client.update_calls.clear()\n\n    synced = service.sync_spotify_metadata_and_cover(managed.id, access_token="token")\n\n    assert synced == managed\n    assert len(client.update_calls) == 1\n    assert client.cover_calls == [("destination", jpeg)]\n'''
          new_test = '''def test_cover_failure_during_explicit_sync_reports_failure_after_metadata_sync(\n    tmp_path: Path,\n) -> None:\n    client = _CoverClient()\n    jpeg = b"\\xff\\xd8cover\\xff\\xd9"\n    service, managed = _activate(tmp_path, client, cover_loader=lambda _cover_id: jpeg)\n    client.fail_cover = True\n    client.cover_calls.clear()\n    client.update_calls.clear()\n\n    with pytest.raises(SpotifyPlaylistSyncError, match=r"metadata applied; cover failed \\(HTTP 403\\)"):\n        service.sync_spotify_metadata_and_cover(managed.id, access_token="token")\n\n    assert len(client.update_calls) == 1\n    assert client.cover_calls == [("destination", jpeg)]\n'''
          assert text.count(old_test) == 1
          path.write_text(text.replace(old_test, new_test))
          PY
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
      - name: Remove temporary workflows and commit
        run: |
          rm .github/workflows/issue65-explicit-sync-fix.yml
          rm .github/workflows/issue65-run-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: diagnose explicit Spotify metadata and cover sync"
          git push origin HEAD:fix/spotify-explicit-sync-diagnostics
