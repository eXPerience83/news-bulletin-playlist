name: Issue 65 run explicit sync fix

on:
  push:
    branches: [fix/spotify-explicit-sync-diagnostics]
    paths:
      - ".github/workflows/issue65-run-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/spotify-explicit-sync-diagnostics
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
      - name: Apply stored patch
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path
          workflow = Path('.github/workflows/issue65-explicit-sync-fix.yml').read_text()
          match = re.search(r'^  B64_PATCH: "([A-Za-z0-9+/=]+)"$', workflow, re.MULTILINE)
          if match is None:
              raise SystemExit('stored patch payload not found')
          exec(base64.b64decode(match.group(1)), {'__name__': '__main__'})
          PY
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
      - name: Remove temporary workflows and commit
        run: |
          rm .github/workflows/issue65-explicit-sync-fix.yml
          rm .github/workflows/issue65-run-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: diagnose explicit Spotify metadata and cover sync"
          git push origin HEAD:fix/spotify-explicit-sync-diagnostics
