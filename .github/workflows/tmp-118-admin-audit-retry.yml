name: Temporary Admin Audit Patch Retry

on:
  push:
    branches:
      - feat/118-admin-audit-diagnostics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/118-admin-audit-diagnostics
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]'
      - name: Apply and refine admin audit patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          workflow = Path('.github/workflows/tmp-118-admin-audit.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(script, 'tmp-118-admin-audit.yml', 'exec'))

          runtime = Path('src/news_bulletin_playlist/engine_runtime.py')
          text = runtime.read_text()
          text = replace_once(
              text,
              '                        playlist_id_for_event, enabled = self._update_managed_playlist(service, form)\n',
              '                        playlist_id_for_event, enabled = self._update_managed_playlist(\n'
              '                            service, form\n'
              '                        )\n',
              'long-line wrap',
          )
          text = replace_once(
              text,
              '    diagnostic_store: DiagnosticEventStore | None = None\n',
              '    diagnostic_store: DiagnosticEventStore | None = None\n'
              '    operational_diagnostics: OperationalDiagnostics | None = None\n',
              'handler shared diagnostics attribute',
          )
          text = text.replace(
              '        OperationalDiagnostics(self.diagnostic_store).emit(\n',
              '        self._admin_diagnostics().emit(\n',
              1,
          )
          text = text.replace(
              '        diagnostics = OperationalDiagnostics(self.diagnostic_store)\n',
              '        diagnostics = self._admin_diagnostics()\n',
              1,
          )
          text = replace_once(
              text,
              '    def _managed_error(self, status: HTTPStatus, message: str) -> None:\n',
              '    def _admin_diagnostics(self) -> OperationalDiagnostics:\n'
              '        diagnostics = self.operational_diagnostics\n'
              '        if diagnostics is not None:\n'
              '            return diagnostics\n'
              '        return OperationalDiagnostics(self.diagnostic_store)\n\n'
              '    def _managed_error(self, status: HTTPStatus, message: str) -> None:\n',
              'admin diagnostics accessor',
          )
          text = replace_once(
              text,
              '    OperationalHealthHandler.diagnostic_store = diagnostic_store\n',
              '    OperationalHealthHandler.diagnostic_store = diagnostic_store\n'
              '    OperationalHealthHandler.operational_diagnostics = diagnostics\n',
              'serve shared diagnostics assignment',
          )
          runtime.write_text(text)

          tests = Path('tests/test_playlist_cover_admin_route.py')
          text = tests.read_text()
          text = replace_once(
              text,
              'import base64\nimport threading\n',
              'import base64\nimport io\nimport logging\nimport threading\n',
              'test logging imports',
          )
          text = replace_once(
              text,
              'from news_bulletin_playlist.lan_admin import LanAdminSecurity\n',
              'from news_bulletin_playlist.lan_admin import LanAdminSecurity\n'
              'from news_bulletin_playlist.runtime_diagnostics import OperationalDiagnostics\n',
              'test diagnostics import',
          )
          text = replace_once(
              text,
              '        diagnostic_store.initialize()\n        self.diagnostic_store = diagnostic_store\n        self.path = path\n',
              '        diagnostic_store.initialize()\n'
              '        self.diagnostic_store = diagnostic_store\n'
              '        self.diagnostic_output = io.StringIO()\n'
              '        diagnostic_logger = logging.Logger("test-admin-diagnostics")\n'
              '        diagnostic_logger.addHandler(logging.StreamHandler(self.diagnostic_output))\n'
              '        self.operational_diagnostics = OperationalDiagnostics(\n'
              '            diagnostic_store, logger=diagnostic_logger\n'
              '        )\n'
              '        self.path = path\n',
              'test shared diagnostics setup',
          )
          text = text.replace(
              '    assert "event=admin_spotify_operation_completed" in captured.out\n',
              '    diagnostic_output = handler.diagnostic_output.getvalue()\n'
              '    assert "event=admin_spotify_operation_completed" in diagnostic_output\n'
              '    assert "access-token-sentinel" not in diagnostic_output\n',
              1,
          )
          text = text.replace(
              '    assert "event=admin_spotify_operation_completed" in captured.out\n',
              '    diagnostic_output = handler.diagnostic_output.getvalue()\n'
              '    assert "event=admin_spotify_operation_completed" in diagnostic_output\n'
              '    assert "refresh-token-sentinel" not in diagnostic_output\n',
              1,
          )
          tests.write_text(text)
          PY
      - name: Format and validate
        run: |
          python scripts/ruff_fix.py
          ruff check .
          ruff format --check .
          mypy src
          pytest -q tests/test_playlist_cover_admin_route.py tests/test_diagnostics_store.py tests/test_diagnostics_web.py tests/test_runtime_diagnostics.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/news_bulletin_playlist/diagnostics.py src/news_bulletin_playlist/managed_admin.py src/news_bulletin_playlist/engine_runtime.py tests/test_playlist_cover_admin_route.py
          git commit -m 'obs(admin): persist sanitized admin action outcomes'
          git push origin HEAD:feat/118-admin-audit-diagnostics
