name: PR211 future barrier one-shot

on:
  push:
    branches:
      - fix/209-ambiguous-evidence-duration

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify audited head is an ancestor
        run: git merge-base --is-ancestor cf84b71102c8cb56f3aa655876f57e2fe8c1200f HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply rollback-safe rejection barrier fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('src/news_bulletin_playlist/engine.py')
          text = engine.read_text()
          old = '''        return any(
              matching_cutoff <= edition.published_at <= now
              and self._edition_has_persistence_rejection_barrier(source, edition)
              for edition in self.store.list_editions(source_id=source_id)
          )
          '''
          new = '''        return any(
              matching_cutoff <= edition.published_at
              and self._edition_has_persistence_rejection_barrier(source, edition)
              for edition in self.store.list_editions(source_id=source_id)
          )
          '''
          if old not in text:
              raise SystemExit('engine barrier window block not found')
          engine.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_pr211_persistence_rejection_barriers.py')
          test_text = tests.read_text()
          marker = 'def test_additional_clock_rollback_keeps_future_barrier_destination_safe('
          if marker not in test_text:
              test_text += '''\n\ndef test_additional_clock_rollback_keeps_future_barrier_destination_safe(\n    tmp_path: Path,\n) -> None:\n    spotify = _RollbackReplacementSpotify()\n    runner, spotify, auth, _ = setup(\n        tmp_path,\n        spotify=spotify,\n        playlists=("first", "second"),\n    )\n\n    # Persist A at 14:00 while its canonical publication time is 09:05. Both physical\n    # destinations start with A, matching the production-risk shape from the audit.\n    runner.clock = lambda: NOW + timedelta(hours=4)\n    assert runner.run_cycle().ok\n    assert spotify.items["destination-first"] == [SER_URI]\n    assert spotify.items["destination-second"] == [SER_URI]\n\n    # Roll back to 10:00 and prove B is the semantic replacement. The temporal guard rejects\n    # A -> B, so the durable barrier must preserve the existing physical destinations.\n    runner.clock = lambda: NOW\n    runner.planner_journal.clear_match_input("ser", "ser-1")\n    for playlist_id in ("first", "second"):\n        runner.planner_journal.mark_destination_unknown(playlist_id)\n    spotify.replacement_catalogue = True\n    spotify.include_invalid_cached = True\n    writes_before = tuple(spotify.replacements)\n\n    rejected = runner.run_cycle()\n    assert not rejected.ok\n    barrier = runner.planner_journal.get_persistence_rejection_barrier("ser", "ser-1")\n    recovery = runner.planner_journal.get_matched_recovery("ser", "ser-1")\n    assert barrier is not None\n    assert recovery is not None\n    assert tuple(spotify.replacements) == writes_before\n    assert spotify.items["destination-first"] == [SER_URI]\n    assert spotify.items["destination-second"] == [SER_URI]\n    calls_after_rejection = spotify.show_calls\n\n    # A second rollback to 08:50 makes published_at=09:05 temporarily future-dated. Matching\n    # planning may exclude it, but destination safety must still consult the durable barrier.\n    restarted = EngineRunner(\n        _config("first", "second"),\n        type(runner.store)(runner.store.path),\n        auth,\n        fetcher=lambda _url: _rss(),\n        client_factory=lambda _token: spotify,\n        clock=lambda: NOW - timedelta(hours=1, minutes=10),\n    )\n    rolled_back = restarted.run_cycle()\n\n    assert not rolled_back.ok\n    assert spotify.show_calls == calls_after_rejection + 2\n    assert tuple(spotify.replacements) == writes_before\n    assert spotify.items["destination-first"] == [SER_URI]\n    assert spotify.items["destination-second"] == [SER_URI]\n    durable = restarted.store.get_match_state(SourceId("ser"), "ser-1")\n    assert durable is not None\n    assert durable.status is MatchStatus.MATCHED\n    assert durable.spotify_episode_uri == SER_URI\n    assert durable.updated_at == NOW + timedelta(hours=4)\n    assert restarted.planner_journal.get_persistence_rejection_barrier("ser", "ser-1") == barrier\n    assert restarted.planner_journal.get_matched_recovery("ser", "ser-1") == recovery\n    assert restarted.planner_journal.get_match_input("ser", "ser-1") is None\n'''
          tests.write_text(test_text)
          PY
          ruff format src/news_bulletin_playlist/engine.py tests/test_pr211_persistence_rejection_barriers.py
      - name: Focused validation
        run: pytest -q tests/test_pr211_persistence_rejection_barriers.py
      - name: Static validation
        run: |
          ruff check .
          ruff format --check .
          mypy src
          git diff --check
      - name: Full test suite
        run: pytest
      - name: Publish functional fix
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm .github/workflows/pr211-future-barrier-one-shot.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve rejection barriers across clock rollback"
          git push origin HEAD:fix/209-ambiguous-evidence-duration
