name: Temporary Spotify duration state patch retry

on:
  push:
    branches:
      - feat/54-spotify-duration-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/54-spotify-duration-state
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]'
      - name: Reapply and fix durable Spotify duration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-54-duration-state.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(script, 'tmp-54-duration-state.yml', 'exec'))

          persistence = Path('src/news_bulletin_playlist/persistence.py')
          text = persistence.read_text()
          marker = '''def _optional_str(value: object) -> str | None:\n'''
          if text.count(marker) != 1:
              raise SystemExit('optional string helper marker mismatch')
          helper = '''def _optional_int(value: object) -> int | None:\n    if value is None:\n        return None\n    if not isinstance(value, int) or isinstance(value, bool):\n        raise PersistenceError("stored optional integer value is invalid")\n    return value\n\n\n'''
          text = text.replace(marker, helper + marker, 1)
          persistence.write_text(text)
          PY
      - name: Format and validate
        run: |
          python scripts/ruff_fix.py
          ruff check .
          ruff format --check .
          mypy src
          pytest -q tests/test_spotify_duration_persistence.py tests/test_spotify_matcher.py tests/test_persistence.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/news_bulletin_playlist/persistence.py src/news_bulletin_playlist/spotify/matcher.py tests/test_spotify_matcher.py tests/test_spotify_duration_persistence.py
          git commit -m 'feat(policy): persist Spotify episode duration'
          git push origin HEAD:feat/54-spotify-duration-state
