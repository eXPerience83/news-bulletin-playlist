name: Temporary PR59 default-order patch

on:
  push:
    branches:
      - fix/57-edition-time-ordering
    paths:
      - .github/scripts/tmp_patch_59.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/57-edition-time-ordering
      - run: python .github/scripts/tmp_patch_59.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/news_bulletin_playlist/config.py docs/ARCHITECTURE.md tests/test_config.py
          git diff --cached --quiet && exit 0
          git commit -m "docs: make edition time the default playlist chronology"
          git push origin HEAD:fix/57-edition-time-ordering
