name: PR211 D1 rerun

on:
  push:
    branches: [fix/209-ambiguous-evidence-duration]
    paths:
      - .github/workflows/pr211-d1-rerun.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor b9356e14625111ac344444e59146fee5b47dba25 HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python .github/pr211_d1_apply.py
      - run: pytest -q tests/test_pr211_persistence_rejection_barriers.py
      - run: |
          ruff check .
          ruff format --check .
          mypy src
          git diff --check
      - run: pytest
      - name: Publish functional fix
        shell: bash
        run: |
          rm .github/pr211_d1_apply.py
          rm .github/workflows/pr211-d1-one-shot.yml
          rm .github/workflows/pr211-d1-rerun.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep rejected repair barrier across inconclusive retries"
          git push origin HEAD:fix/209-ambiguous-evidence-duration
