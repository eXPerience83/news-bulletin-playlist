name: Temporary PR60 Ruff patch

on:
  push:
    branches:
      - feat/58-playlist-repository-footer
    paths:
      - .github/scripts/tmp_patch_60_ruff.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/58-playlist-repository-footer
      - run: python .github/scripts/tmp_patch_60_ruff.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_managed_admin.py
          git diff --cached --quiet && exit 0
          git commit -m "test: format footer expectations"
          git push origin HEAD:feat/58-playlist-repository-footer
