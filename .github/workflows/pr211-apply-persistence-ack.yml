name: Apply PR211 persistence acknowledgement fix

on:
  push:
    branches:
      - fix/209-ambiguous-evidence-duration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Apply persistence acknowledgement fix
        run: python .github/pr211_fix_persistence_ack.py

      - name: Correct rollback fixture timestamp
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_pr211_adversarial_regressions.py")
          text = path.read_text()
          old = '''    _persist_cached_match(store, edition, uri=URI_309, duration=60)\n\n    stale_cached_candidate = _candidate(\n'''
          new = '''    _persist_cached_match(store, edition, uri=URI_309, duration=60)\n    # Pin the durable row at NOW so the recovery observation at NOW-10m is rejected by\n    # SQLite's monotonic updated_at guard. The shared helper deliberately stores older state.\n    assert store.set_match_state(\n        *edition.identity,\n        status=MatchStatus.MATCHED,\n        spotify_episode_uri=URI_309,\n        spotify_duration_seconds=60,\n        diagnostics="known mapping at current durable time",\n        updated_at=NOW,\n    )\n\n    stale_cached_candidate = _candidate(\n'''
          if old not in text:
              raise SystemExit("rollback fixture anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-shot patch machinery
        run: |
          rm .github/pr211_fix_persistence_ack.py
          rm .github/workflows/pr211-apply-persistence-ack.yml

      - name: Format changed Python
        run: |
          ruff check --fix --select I \
            src/news_bulletin_playlist/persistence.py \
            src/news_bulletin_playlist/spotify/matcher.py \
            tests/test_persistence_replay.py \
            tests/test_pr211_adversarial_regressions.py \
            tests/test_engine.py
          ruff format \
            src/news_bulletin_playlist/persistence.py \
            src/news_bulletin_playlist/spotify/matcher.py \
            tests/test_persistence_replay.py \
            tests/test_pr211_adversarial_regressions.py \
            tests/test_engine.py

      - name: Validate diff whitespace
        run: git diff --check

      - name: Ruff
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Focused persistence acknowledgement regressions
        run: |
          pytest -q \
            tests/test_persistence_replay.py \
            tests/test_pr211_adversarial_regressions.py \
            tests/test_engine.py -k 'clock_rollback or rejected_repair or stale_replays'

      - name: Full pytest
        run: pytest

      - name: Commit validated fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(#209): acknowledge rejected match repairs'
          git push origin HEAD:${{ github.ref_name }}
