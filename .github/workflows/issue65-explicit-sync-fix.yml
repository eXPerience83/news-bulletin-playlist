name: Issue 65 explicit sync fix

on:
  push:
    branches: [fix/spotify-explicit-sync-diagnostics]
    paths:
      - ".github/workflows/issue65-explicit-sync-fix.yml"

permissions:
  contents: write

env:
  B64_PATCH: "  "

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/spotify-explicit-sync-diagnostics
      - name: Patch explicit Spotify sync diagnostics
        run: python -c "import base64, os; exec(base64.b64decode(os.environ['B64_PATCH']))"
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/issue65-explicit-sync-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/news_bulletin_playlist/managed_admin.py src/news_bulletin_playlist/engine_runtime.py tests/test_playlist_cover_admin_route.py .github/workflows/issue65-explicit-sync-fix.yml
          git commit -m "fix: diagnose explicit Spotify metadata and cover sync"
          git push origin HEAD:fix/spotify-explicit-sync-diagnostics
