name: Apply #208 pending-read fix

on:
  push:
    branches:
      - perf/208-pending-not-before

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/208-pending-not-before
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Keep optional pending lookup fail-soft
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/news_bulletin_playlist/engine.py')
          text = path.read_text()
          old = '''            if state.dirty and not state.unknown and context_matches:\n                pending = PendingSnapshotJournal(self.store).get(playlist.id)\n                if (\n'''
          new = '''            if state.dirty and not state.unknown and context_matches:\n                try:\n                    pending = PendingSnapshotJournal(self.store).get(playlist.id)\n                except PersistenceError:\n                    # This read exists only to authorize the optional 60-second local deferral.\n                    # If it is unavailable, preserve the pre-existing conservative provider flow\n                    # instead of turning an optimization lookup into a destination failure.\n                    pending = None\n                if (\n'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pip install ruff==0.16.8
      - run: ruff format src/news_bulletin_playlist/engine.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/news_bulletin_playlist/engine.py
          git commit -m "Keep optional pending lookup fail-soft"
          git push origin HEAD:perf/208-pending-not-before
