name: Temporary Ruff Format PR 77

on:
  push:
    branches: [fix/77-rebuild-current-main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/77-rebuild-current-main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply Ruff formatting
        run: ruff format .
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Ruff formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "style: normalize rebased Spotify metadata fix"
          git push origin HEAD:fix/77-rebuild-current-main
