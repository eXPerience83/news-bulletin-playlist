name: Publish stable AMD64

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-stable-amd64
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/experience83/news-bulletin-playlist

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact stable release tag
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "ERROR: stable publication requires exact SemVer vMAJOR.MINOR.PATCH without leading zeroes; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Require tagged commit from main history
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "ERROR: stable tag commit must belong to main history" >&2
            exit 1
          fi

      - name: Require this to be the newest stable SemVer tag
        run: |
          set -euo pipefail
          latest="$(
            git tag --list 'v*' --merged refs/remotes/origin/main |
              python3 -c 'import re,sys; pattern=re.compile(r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"); items=[(tuple(int(part) for part in match.groups()), tag) for raw in sys.stdin if (tag:=raw.strip()) and (match:=pattern.fullmatch(tag))]; print(max(items)[1] if items else "")'
          )"
          if [[ "$latest" != "$GITHUB_REF_NAME" ]]; then
            echo "ERROR: refusing stable regression; newest stable tag on main is $latest, current tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Resolve publication metadata
        id: meta
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: invalid stable source revision: $GITHUB_SHA" >&2
            exit 1
          fi
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate configuration
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config --quiet
          docker compose -f deploy/truenas.yaml config --quiet

      - name: Build exact stable candidate
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --tag news-bulletin-playlist:stable-candidate \
            .

      - name: Smoke test exact stable candidate
        run: |
          set -euo pipefail
          docker volume create news-bulletin-stable-data
          docker run --detach --rm \
            --name news-bulletin-playlist-stable \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18791:8080 \
            --mount source=news-bulletin-stable-data,target=/data \
            news-bulletin-playlist:stable-candidate

          remaining=20
          while [ "$remaining" -gt 0 ]; do
            status="$(docker inspect --format '{{.State.Health.Status}}' news-bulletin-playlist-stable)"
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              docker logs news-bulletin-playlist-stable
              exit 1
            fi
            remaining=$((remaining - 1))
            sleep 1
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' news-bulletin-playlist-stable)" = healthy
          curl --fail --silent --show-error http://127.0.0.1:18791/ | grep -q 'News Bulletin Playlists'
          curl --fail --silent --show-error http://127.0.0.1:18791/healthz | grep -q '"status":"ok"'

      - name: Stop stable candidate
        if: always()
        run: |
          docker stop news-bulletin-playlist-stable 2>/dev/null || true
          docker volume rm news-bulletin-stable-data 2>/dev/null || true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Revalidate release tag and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "ERROR: invalid stable version during promotion: $VERSION" >&2
            exit 1
          fi

          current_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq '.sha')"
          if [[ "$current_tag_sha" != "$SOURCE_SHA" ]]; then
            echo "ERROR: release tag moved after validation; expected $SOURCE_SHA, got $current_tag_sha" >&2
            exit 1
          fi

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...${current_main}" --jq '.merge_base_commit.sha')"
          if [[ "$merge_base" != "$SOURCE_SHA" ]]; then
            echo "ERROR: stable source is no longer in current main history" >&2
            exit 1
          fi

      - name: Publish or reuse immutable version tag
        id: version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}"
          version_ref="${image}:${VERSION}"
          local_id="$(docker image inspect news-bulletin-playlist:stable-candidate --format '{{.Id}}')"

          inspect_error="$(mktemp)"
          trap 'rm -f "$inspect_error"' EXIT
          if digest="$(docker buildx imagetools inspect "$version_ref" --format '{{json .Manifest.Digest}}' 2>"$inspect_error" | tr -d '"')"; then
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: existing version tag returned invalid digest: $digest" >&2
              exit 1
            fi
          else
            if ! grep -Fqi 'manifest unknown' "$inspect_error" && ! grep -Fqi "${version_ref}: not found" "$inspect_error"; then
              cat "$inspect_error" >&2
              echo "ERROR: could not safely determine whether immutable version tag exists" >&2
              exit 1
            fi
            docker tag news-bulletin-playlist:stable-candidate "$version_ref"
            docker push "$version_ref"
            digest="$(docker buildx imagetools inspect "$version_ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: invalid stable digest: $digest" >&2
              exit 1
            fi
          fi

          resolved_ref="${image}@${digest}"
          docker pull "$resolved_ref"
          resolved_id="$(docker image inspect "$resolved_ref" --format '{{.Id}}')"
          if [[ "$resolved_id" != "$local_id" ]]; then
            echo "ERROR: immutable version digest does not match the tested image" >&2
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version_ref=$version_ref" >> "$GITHUB_OUTPUT"

      - name: Revalidate release intent immediately before mutable promotion
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          current_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq '.sha')"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...${current_main}" --jq '.merge_base_commit.sha')"
          if [[ "$current_tag_sha" != "$SOURCE_SHA" || "$merge_base" != "$SOURCE_SHA" ]]; then
            echo "ERROR: release authorization changed during publication; refusing stable/latest promotion" >&2
            exit 1
          fi

      - name: Promote exact digest to stable aliases
        env:
          IMAGE_DIGEST: ${{ steps.version.outputs.digest }}
          VERSION_REF: ${{ steps.version.outputs.version_ref }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}"
          source_ref="${image}@${IMAGE_DIGEST}"

          promote() {
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${image}:stable" \
              --tag "${image}:stable-amd64" \
              --tag "${image}:latest" \
              "$source_ref"
          }

          if ! promote; then
            echo "WARN: stable alias promotion failed; retrying once" >&2
            sleep 2
            promote
          fi

          for tag in stable stable-amd64 latest; do
            actual="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [[ "$actual" != "$IMAGE_DIGEST" ]]; then
              echo "ERROR: ${image}:${tag} resolved to $actual instead of $IMAGE_DIGEST" >&2
              exit 1
            fi
          done

          version_digest="$(docker buildx imagetools inspect "$VERSION_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ "$version_digest" != "$IMAGE_DIGEST" ]]; then
            echo "ERROR: immutable version tag changed during stable promotion" >&2
            exit 1
          fi

