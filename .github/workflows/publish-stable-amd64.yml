name: Publish stable AMD64

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-stable-amd64
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/experience83/news-bulletin-playlist

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact stable release tag
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: stable publication requires exact vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Require tagged commit from main history
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "ERROR: stable tag commit must belong to main history" >&2
            exit 1
          fi

      - name: Validate configuration
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config --quiet
          docker compose -f deploy/truenas.yaml config --quiet

      - name: Build exact stable candidate
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --tag news-bulletin-playlist:stable-candidate \
            .

      - name: Smoke test exact stable candidate
        run: |
          set -euo pipefail
          docker volume create news-bulletin-stable-data
          docker run --detach --rm \
            --name news-bulletin-playlist-stable \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18791:8080 \
            --mount source=news-bulletin-stable-data,target=/data \
            news-bulletin-playlist:stable-candidate

          remaining=20
          while [ "$remaining" -gt 0 ]; do
            status="$(docker inspect --format '{{.State.Health.Status}}' news-bulletin-playlist-stable)"
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              docker logs news-bulletin-playlist-stable
              exit 1
            fi
            remaining=$((remaining - 1))
            sleep 1
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' news-bulletin-playlist-stable)" = healthy
          curl --fail --silent --show-error http://127.0.0.1:18791/ | grep -q 'News Bulletin Playlists'
          curl --fail --silent --show-error http://127.0.0.1:18791/healthz | grep -q '"status":"ok"'

      - name: Stop stable candidate
        if: always()
        run: |
          docker stop news-bulletin-playlist-stable 2>/dev/null || true
          docker volume rm news-bulletin-stable-data 2>/dev/null || true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Publish stable tags
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}"
          for tag in "$GITHUB_REF_NAME" stable stable-amd64 latest "sha-${GITHUB_SHA}"; do
            docker tag news-bulletin-playlist:stable-candidate "${image}:${tag}"
            docker push "${image}:${tag}"
          done

          digest="$(docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid stable digest: $digest" >&2
            exit 1
          fi
          for tag in "$GITHUB_REF_NAME" stable stable-amd64 latest "sha-${GITHUB_SHA}"; do
            actual="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [[ "$actual" != "$digest" ]]; then
              echo "ERROR: ${image}:${tag} resolved to $actual instead of $digest" >&2
              exit 1
            fi
          done
