name: Temporary duration policy integration regressions

on:
  push:
    branches:
      - feat/54-duration-policy

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/54-duration-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]'
      - name: Add fail-safe and observability regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('tests/test_engine.py')
          text = engine.read_text()
          addition = '''\n\ndef test_missing_spotify_duration_preserves_existing_destination_without_write(\n    tmp_path: Path,\n) -> None:\n    existing_uri = "spotify:episode:preexisting"\n\n    class MissingDurationSpotify(_Spotify):\n        def show_episodes(\n            self,\n            show_id: str,\n            *,\n            limit: int = 50,\n            offset: int = 0,\n        ) -> dict[str, Any]:\n            page = super().show_episodes(show_id, limit=limit, offset=offset)\n            item = page["items"][0]\n            assert isinstance(item, dict)\n            item.pop("duration_ms")\n            return page\n\n    spotify = MissingDurationSpotify()\n    spotify.items["destination-first"] = [existing_uri]\n    runner = EngineRunner(\n        _config("first"),\n        _store(tmp_path),\n        _Auth(),\n        fetcher=lambda _url: _rss(),\n        client_factory=lambda _token: spotify,\n        clock=lambda: NOW,\n    )\n\n    result = runner.run_cycle()\n\n    assert not result.ok\n    assert result.sources[0].matching_ok is True\n    assert not result.playlists[0].ok\n    assert result.playlists[0].wrote is None\n    assert "Spotify duration unavailable" in (result.playlists[0].error or "")\n    assert spotify.items["destination-first"] == [existing_uri]\n    assert spotify.playlist_reads == []\n    assert spotify.replacements == []\n'''
          if 'test_missing_spotify_duration_preserves_existing_destination_without_write' in text:
              raise SystemExit('engine regression already exists')
          engine.write_text(text + addition)

          diagnostics = Path('tests/test_runtime_diagnostics.py')
          text = diagnostics.read_text()
          old_import = '''from news_bulletin_playlist.diagnostics import (\n    DiagnosticEventStore,\n    DiagnosticSeverity,\n)\n'''
          new_import = '''from news_bulletin_playlist.desired_state import (\n    DURATION_EXCEPTION,\n    DURATION_EXCEEDS_DEFAULT_MAX,\n    DurationEligibilityDecision,\n)\nfrom news_bulletin_playlist.diagnostics import (\n    DiagnosticEventStore,\n    DiagnosticSeverity,\n)\n'''
          if text.count(old_import) != 1:
              raise SystemExit('runtime diagnostics import marker mismatch')
          text = text.replace(old_import, new_import, 1)
          addition = '''\n\ndef test_duration_policy_decisions_emit_sanitized_eligibility_events(tmp_path: Path) -> None:\n    diagnostics, store, output = _diagnostics(tmp_path)\n    result = EngineCycleResult(\n        started_at=NOW,\n        finished_at=NOW + timedelta(seconds=1),\n        ok=True,\n        sources=(),\n        playlists=(\n            PlaylistCycleOutcome(\n                playlist_id=PlaylistId("spain_spanish_news"),\n                ok=True,\n                desired_count=1,\n                applied_count=1,\n                wrote=False,\n                last_success_at=NOW,\n                duration_decisions=(\n                    DurationEligibilityDecision(\n                        source_id=SourceId("ser"),\n                        source_native_id="must-not-be-persisted",\n                        duration_seconds=1200,\n                        accepted=True,\n                        reason=DURATION_EXCEPTION,\n                        max_seconds=1800,\n                        exception_id="ser_morning_0800",\n                    ),\n                    DurationEligibilityDecision(\n                        source_id=SourceId("rne"),\n                        source_native_id="also-not-persisted",\n                        duration_seconds=481,\n                        accepted=False,\n                        reason=DURATION_EXCEEDS_DEFAULT_MAX,\n                        max_seconds=480,\n                    ),\n                ),\n            ),\n        ),\n    )\n\n    InstrumentedEngineCycleRunner(\n        _Runner(result),\n        diagnostics,\n        clock=lambda: NOW,\n    ).run_cycle()\n\n    policy_events = tuple(\n        event for event in store.list_events(limit=20)\n        if event.component == "playlist.eligibility"\n    )\n    assert {event.event_name for event in policy_events} == {\n        "duration_exception_applied",\n        "duration_episode_excluded",\n    }\n    exception = next(\n        event for event in policy_events if event.event_name == "duration_exception_applied"\n    )\n    assert exception.source_id == "ser"\n    assert exception.details == {\n        "duration_seconds": 1200,\n        "eligibility_reason": "duration_exception",\n        "max_seconds": 1800,\n        "policy_exception": "ser_morning_0800",\n    }\n    excluded = next(\n        event for event in policy_events if event.event_name == "duration_episode_excluded"\n    )\n    assert excluded.source_id == "rne"\n    assert excluded.details == {\n        "duration_seconds": 481,\n        "eligibility_reason": "duration_exceeds_default_max",\n        "max_seconds": 480,\n    }\n    rendered = output.getvalue()\n    assert "must-not-be-persisted" not in rendered\n    assert "also-not-persisted" not in rendered\n'''
          if 'test_duration_policy_decisions_emit_sanitized_eligibility_events' in text:
              raise SystemExit('observability regression already exists')
          diagnostics.write_text(text + addition)
          PY
      - name: Validate regressions and complete repository
        run: |
          python scripts/ruff_fix.py
          ruff check .
          ruff format --check .
          mypy src
          pytest -q
      - name: Commit regressions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_engine.py tests/test_runtime_diagnostics.py
          git commit -m 'test(policy): cover duration fail-safe and observability'
          git push origin HEAD:feat/54-duration-policy
