name: PR211 D2 rerun3

on:
  push:
    branches: [fix/209-ambiguous-evidence-duration]
    paths:
      - .github/workflows/pr211-d2-rerun3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify audited head is an ancestor
        run: git merge-base --is-ancestor c70d755fd1e151123bc5d8ee98e3c2be9e1f9370 HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply D2 durable barrier fix
        run: |
          python .github/pr211_d2_apply.txt
          python .github/pr211_d2_followup.txt
          python .github/pr211_d2_mypy_fix.txt
          python .github/pr211_d2_legacy_fix.txt
          rm .github/pr211_d2_apply.txt .github/pr211_d2_followup.txt .github/pr211_d2_mypy_fix.txt .github/pr211_d2_legacy_fix.txt
          rm .github/workflows/pr211-d2-one-shot.yml .github/workflows/pr211-d2-rerun.yml .github/workflows/pr211-d2-rerun2.yml .github/workflows/pr211-d2-rerun3.yml
          ruff format src/news_bulletin_playlist/persistence.py src/news_bulletin_playlist/spotify_planner.py src/news_bulletin_playlist/engine.py tests/test_persistence.py tests/test_spotify_planner.py tests/test_pr211_persistence_rejection_barriers.py
      - name: Focused D2 validation
        run: |
          pytest -q tests/test_pr211_persistence_rejection_barriers.py
          pytest -q tests/test_spotify_planner.py tests/test_persistence.py tests/test_spotify_duration_persistence.py
      - name: Static validation
        run: |
          ruff check .
          ruff format --check .
          mypy src
          git diff --check
      - name: Full test suite
        run: pytest
      - name: Publish functional fix
        shell: bash
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist rejected match repairs independently of scheduling"
          git push origin HEAD:fix/209-ambiguous-evidence-duration
