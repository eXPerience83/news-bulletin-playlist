name: Temporary PR122 compatibility fix

on:
  push:
    branches:
      - feat/54-spotify-duration-state

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/54-spotify-duration-state
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]'
      - name: Make EditionMatch duration backward-compatible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/news_bulletin_playlist/persistence.py')
          text = path.read_text()
          old = '''class EditionMatch:\n    source_id: SourceId\n    source_native_id: str\n    status: MatchStatus\n    spotify_episode_uri: str | None\n    spotify_duration_seconds: int | None\n    diagnostics: str | None\n    updated_at: datetime\n'''
          new = '''class EditionMatch:\n    source_id: SourceId\n    source_native_id: str\n    status: MatchStatus\n    spotify_episode_uri: str | None\n    diagnostics: str | None\n    updated_at: datetime\n    spotify_duration_seconds: int | None = None\n'''
          if text.count(old) != 1:
              raise SystemExit('EditionMatch block mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate full repository
        run: |
          ruff check .
          ruff format --check .
          mypy src
          pytest -q
      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/news_bulletin_playlist/persistence.py
          git commit -m 'fix(policy): keep EditionMatch duration optional'
          git push origin HEAD:feat/54-spotify-duration-state
