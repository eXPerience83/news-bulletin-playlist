name: Apply CodeRabbit fixes v2

on:
  push:
    branches:
      - feat/19-production-spotify-oauth
    paths:
      - .github/workflows/apply-coderabbit-fixes-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/19-production-spotify-oauth
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
      - name: Apply reviewed security changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              left = text.index(start)
              right = text.index(end, left)
              return text[:left] + replacement + text[right:]

          runtime = Path('src/news_bulletin_playlist/runtime.py')
          text = runtime.read_text()
          text = text.replace('import html\nimport json\n', 'import html\nimport ipaddress\nimport json\n')
          text = text.replace('from collections.abc import Mapping\n', 'from collections.abc import Mapping, Sequence\n')
          text = text.replace(
              '_EXTERNAL_URL_ENV = "NEWS_PLAYLIST_EXTERNAL_URL"\n',
              '_EXTERNAL_URL_ENV = "NEWS_PLAYLIST_EXTERNAL_URL"\n'
              '_TRUSTED_PROXY_CIDRS_ENV = "NEWS_PLAYLIST_TRUSTED_PROXY_CIDRS"\n',
          )
          text = text.replace(
              '_MAX_FORM_BYTES = 4096\n\n\nclass AdminSecurity:',
              '_MAX_FORM_BYTES = 4096\n\n'
              'TrustedProxyNetwork = ipaddress.IPv4Network | ipaddress.IPv6Network\n\n\n'
              'class AdminSecurity:',
          )

          admin_class = '''class AdminSecurity:\n    """Protect the small server-rendered administration surface."""\n\n    def __init__(\n        self,\n        password: str,\n        *,\n        trusted_proxy_networks: Sequence[TrustedProxyNetwork] = (),\n        allow_direct_loopback: bool = True,\n    ) -> None:\n        if not password.strip():\n            raise RuntimeError("administration password must not be blank")\n        if len(password) < 16:\n            raise RuntimeError("administration password must contain at least 16 characters")\n        if "\\r" in password or "\\n" in password:\n            raise RuntimeError("administration password must not contain line breaks")\n        self._password = password\n        self._trusted_proxy_networks = tuple(trusted_proxy_networks)\n        self._allow_direct_loopback = allow_direct_loopback\n        self._csrf_token: str | None = None\n        self._csrf_expires_at: datetime | None = None\n\n    def is_secure_transport(\n        self,\n        client_ip: str,\n        forwarded_proto_values: Sequence[str] | None,\n    ) -> bool:\n        """Accept loopback dev traffic or HTTPS asserted by an explicitly trusted proxy."""\n        try:\n            address = ipaddress.ip_address(client_ip)\n        except ValueError:\n            return False\n        if self._allow_direct_loopback and address.is_loopback:\n            return True\n        trusted = any(\n            address.version == network.version and address in network\n            for network in self._trusted_proxy_networks\n        )\n        if not trusted or forwarded_proto_values is None or len(forwarded_proto_values) != 1:\n            return False\n        return forwarded_proto_values[0].strip().lower() == "https"\n\n    def is_authorized(self, header: str | None) -> bool:\n        if header is None:\n            return False\n        scheme, separator, encoded = header.partition(" ")\n        if separator != " " or scheme.lower() != "basic" or not encoded:\n            return False\n        try:\n            decoded = base64.b64decode(encoded, validate=True).decode("utf-8")\n        except (binascii.Error, UnicodeDecodeError):\n            return False\n        username, separator, password = decoded.partition(":")\n        if separator != ":" or username != "admin":\n            return False\n        return hmac.compare_digest(password, self._password)\n\n    def issue_csrf_token(self, *, now: datetime | None = None) -> str:\n        observed_at = _as_utc(now or datetime.now(UTC))\n        token = secrets.token_urlsafe(32)\n        self._csrf_token = token\n        self._csrf_expires_at = observed_at + _CSRF_TTL\n        return token\n\n    def consume_csrf_token(self, token: str, *, now: datetime | None = None) -> bool:\n        observed_at = _as_utc(now or datetime.now(UTC))\n        expected = self._csrf_token\n        expires_at = self._csrf_expires_at\n        if expected is None or expires_at is None:\n            return False\n        if observed_at > expires_at or not hmac.compare_digest(token, expected):\n            return False\n        self._csrf_token = None\n        self._csrf_expires_at = None\n        return True\n'''
          text = replace_between(text, 'class AdminSecurity:', '\n\ndef _data_dir_ready', admin_class,)

          build_auth = '''def build_runtime_auth(\n    data_dir: Path,\n    *,\n    environ: Mapping[str, str] | None = None,\n) -> tuple[AdminSecurity | None, SpotifyAuthService | None]:\n    """Build private administration and Spotify auth from runtime-only settings."""\n    env = os.environ if environ is None else environ\n    admin_password = _load_admin_password(env)\n    client_id = _optional_setting(env.get(_SPOTIFY_CLIENT_ID_ENV))\n    external_url = _optional_setting(env.get(_EXTERNAL_URL_ENV))\n    trusted_proxy_networks = _parse_trusted_proxy_networks(\n        _optional_setting(env.get(_TRUSTED_PROXY_CIDRS_ENV))\n    )\n\n    if (client_id is None) != (external_url is None):\n        raise RuntimeError(\n            f"{_SPOTIFY_CLIENT_ID_ENV} and {_EXTERNAL_URL_ENV} must be configured together"\n        )\n    if client_id is not None and admin_password is None:\n        raise RuntimeError(\n            f"{_ADMIN_PASSWORD_ENV} or {_ADMIN_PASSWORD_FILE_ENV} is required when Spotify "\n            "Web UI authorization is enabled"\n        )\n    if admin_password is None and trusted_proxy_networks:\n        raise RuntimeError(f"{_TRUSTED_PROXY_CIDRS_ENV} requires administration to be enabled")\n\n    redirect_uri: str | None = None\n    external_scheme: str | None = None\n    if external_url is not None:\n        try:\n            redirect_uri = build_redirect_uri(external_url)\n        except SpotifyAuthConfigurationError as exc:\n            raise RuntimeError(\n                f"invalid Spotify Web UI authorization configuration: {exc}"\n            ) from exc\n        external_scheme = urllib.parse.urlsplit(redirect_uri).scheme\n\n    if admin_password is not None and external_scheme == "https" and not trusted_proxy_networks:\n        raise RuntimeError(\n            f"{_TRUSTED_PROXY_CIDRS_ENV} is required for HTTPS administration behind a "\n            "reverse proxy"\n        )\n\n    admin_security = (\n        AdminSecurity(\n            admin_password,\n            trusted_proxy_networks=trusted_proxy_networks,\n            allow_direct_loopback=external_scheme != "https",\n        )\n        if admin_password is not None\n        else None\n    )\n    if client_id is None or redirect_uri is None:\n        return admin_security, None\n\n    return (\n        admin_security,\n        SpotifyAuthService(\n            client_id=client_id,\n            redirect_uri=redirect_uri,\n            store=SpotifyCredentialStore(data_dir / SPOTIFY_AUTH_FILENAME),\n        ),\n    )\n'''
          text = replace_between(text, 'def build_runtime_auth(', '\n\ndef _status_page', build_auth)

          require_admin = '''    def _require_admin_transport(self) -> AdminSecurity | None:\n        security = self.admin_security\n        if security is None:\n            self._reply(HTTPStatus.NOT_FOUND, b"Not found")\n            return None\n        forwarded_proto = self.headers.get_all("X-Forwarded-Proto")\n        if not security.is_secure_transport(self.client_address[0], forwarded_proto):\n            self._reply(\n                HTTPStatus.FORBIDDEN,\n                b"Administration requires a trusted HTTPS reverse proxy",\n                content_type="text/plain; charset=utf-8",\n            )\n            return None\n        return security\n\n    def _require_admin(self) -> AdminSecurity | None:\n        security = self._require_admin_transport()\n        if security is None:\n            return None\n        if not security.is_authorized(self.headers.get("Authorization")):\n            self._reply(\n                HTTPStatus.UNAUTHORIZED,\n                b"Administration authentication required",\n                content_type="text/plain; charset=utf-8",\n                extra_headers={"WWW-Authenticate": 'Basic realm="news-bulletin-playlist-admin"'},\n            )\n            return None\n        return security\n'''
          text = replace_between(text, '    def _require_admin(self)', '\n    def do_GET', require_admin)
          text = text.replace(
              '        if parsed.path == "/admin/spotify/callback":\n'
              '            self._handle_spotify_callback(parsed.query)\n'
              '            return\n',
              '        if parsed.path == "/admin/spotify/callback":\n'
              '            if self._require_admin_transport() is None:\n'
              '                return\n'
              '            self._handle_spotify_callback(parsed.query)\n'
              '            return\n',
          )

          proxy_parser = '''def _parse_trusted_proxy_networks(\n    value: str | None,\n) -> tuple[TrustedProxyNetwork, ...]:\n    """Parse explicit reverse-proxy IP/CIDR entries used to trust HTTPS forwarding."""\n    if value is None:\n        return ()\n    entries = [entry.strip() for entry in value.split(",")]\n    if not entries or any(not entry for entry in entries):\n        raise RuntimeError(f"{_TRUSTED_PROXY_CIDRS_ENV} contains an empty entry")\n    networks: list[TrustedProxyNetwork] = []\n    for entry in entries:\n        try:\n            networks.append(ipaddress.ip_network(entry, strict=False))\n        except ValueError as exc:\n            raise RuntimeError(\n                f"{_TRUSTED_PROXY_CIDRS_ENV} contains an invalid IP/CIDR"\n            ) from exc\n    return tuple(networks)\n\n\n'''
          text = text.replace(
              'def _optional_setting(value: str | None, *, strip: bool = True) -> str | None:\n',
              proxy_parser + 'def _optional_setting(value: str | None, *, strip: bool = True) -> str | None:\n',
          )
          runtime.write_text(text)

          auth = Path('src/news_bulletin_playlist/spotify/auth.py')
          text = auth.read_text()
          store_tail = '''    def discard(self) -> None:\n        """Delete persisted authorization after a credential is known to be invalid."""\n        try:\n            self.path.unlink()\n        except FileNotFoundError:\n            return\n        except OSError as exc:\n            raise SpotifyCredentialStoreError(\n                "Spotify authorization state could not be discarded"\n            ) from exc\n        try:\n            _fsync_directory(self.path.parent)\n        except OSError as exc:\n            raise SpotifyCredentialStoreError(\n                "Spotify authorization state deletion could not be synchronized"\n            ) from exc\n\n    def mark_reauthorization_required(self, previous: SpotifyCredentialRecord) -> None:\n        marker = SpotifyCredentialRecord(\n            status=CredentialStatus.REAUTH_REQUIRED,\n            refresh_token=None,\n            granted_scopes=previous.granted_scopes,\n            authorized_at=previous.authorized_at,\n        )\n        try:\n            self.save(marker)\n        except SpotifyCredentialStoreError:\n            with suppress(SpotifyCredentialStoreError):\n                self.discard()\n            raise\n'''
          text = replace_between(
              text,
              '    def mark_reauthorization_required(',
              '\n\nclass SpotifyAuthService:',
              store_tail,
          )

          service_init = '''    def __init__(\n        self,\n        *,\n        client_id: str,\n        redirect_uri: str,\n        store: SpotifyCredentialStore,\n        transport: SpotifyTokenTransport | None = None,\n        scopes: Sequence[str] = PRODUCTION_SCOPES,\n    ) -> None:\n        if not client_id.strip():\n            raise SpotifyAuthConfigurationError("Spotify client ID is required")\n        self.client_id = client_id.strip()\n        self.redirect_uri = validate_redirect_uri(redirect_uri)\n        self.store = store\n        self.transport = transport if transport is not None else SpotifyAccountsClient()\n        self.scopes = tuple(scopes)\n        if not self.scopes or any(not scope.strip() for scope in self.scopes):\n            raise SpotifyAuthConfigurationError("Spotify authorization scopes are invalid")\n        self._pending: PendingAuthorization | None = None\n        self._access_token: _CachedAccessToken | None = None\n        self._reauthorization_required = False\n\n    def authorization_state(self) -> AuthorizationState:\n        if self._reauthorization_required:\n            return AuthorizationState.REAUTH_REQUIRED\n        try:\n            record = self.store.load()\n        except SpotifyCredentialStoreError:\n            return AuthorizationState.ERROR\n        if record is None:\n            return AuthorizationState.DISCONNECTED\n        if record.status is CredentialStatus.REAUTH_REQUIRED:\n            return AuthorizationState.REAUTH_REQUIRED\n        return AuthorizationState.CONNECTED\n'''
          class_start = text.index('class SpotifyAuthService:')
          init_start = text.index('    def __init__(', class_start)
          start_auth = text.index('    def start_authorization(', init_start)
          text = text[:init_start] + service_init + '\n' + text[start_auth:]
          text = text.replace(
              '        self.store.save(record)\n        self._access_token = _CachedAccessToken(\n',
              '        self.store.save(record)\n'
              '        self._reauthorization_required = False\n'
              '        self._access_token = _CachedAccessToken(\n',
              1,
          )

          get_access = '''    def get_access_token(self, *, now: datetime | None = None) -> str:\n        observed_at = _as_utc(now or datetime.now(UTC))\n        if self._reauthorization_required:\n            raise SpotifyReauthorizationRequired("Spotify authorization is required")\n        cached = self._access_token\n        if cached is not None and cached.expires_at > observed_at + _ACCESS_TOKEN_REFRESH_SKEW:\n            return cached.value\n\n        record = self.store.load()\n        if record is None or record.status is CredentialStatus.REAUTH_REQUIRED:\n            self._access_token = None\n            self._reauthorization_required = True\n            raise SpotifyReauthorizationRequired("Spotify authorization is required")\n        refresh_token = record.refresh_token\n        if refresh_token is None:\n            self._access_token = None\n            self._reauthorization_required = True\n            raise SpotifyReauthorizationRequired("Spotify authorization is required")\n\n        try:\n            token = self.transport.refresh_token(\n                client_id=self.client_id,\n                refresh_token=refresh_token,\n            )\n        except SpotifyTokenEndpointError as exc:\n            if exc.error_code == "invalid_grant":\n                self._access_token = None\n                self._reauthorization_required = True\n                try:\n                    self.store.mark_reauthorization_required(record)\n                except SpotifyCredentialStoreError as store_exc:\n                    raise SpotifyReauthorizationRequired(\n                        "Spotify authorization expired or was revoked; reauthorization is required"\n                    ) from store_exc\n                raise SpotifyReauthorizationRequired(\n                    "Spotify authorization expired or was revoked"\n                ) from exc\n            raise\n\n        _require_scopes(token.granted_scopes, self.scopes)\n        if token.refresh_token is not None and token.refresh_token != refresh_token:\n            self.store.save(\n                SpotifyCredentialRecord(\n                    status=CredentialStatus.ACTIVE,\n                    refresh_token=token.refresh_token,\n                    granted_scopes=token.granted_scopes,\n                    authorized_at=record.authorized_at,\n                )\n            )\n        self._access_token = _CachedAccessToken(\n            token.access_token,\n            observed_at + timedelta(seconds=token.expires_in),\n        )\n        return token.access_token\n'''
          text = replace_between(text, '    def get_access_token(', '\n\ndef build_redirect_uri', get_access)
          auth.write_text(text)

          runtime_tests = Path('tests/test_runtime.py')
          rt = runtime_tests.read_text()
          if 'test_admin_transport_requires_trusted_https_proxy' not in rt:
              rt += '''\n\ndef test_admin_transport_requires_trusted_https_proxy() -> None:\n    import ipaddress\n\n    security = AdminSecurity(\n        "long-enough-admin-password",\n        trusted_proxy_networks=(ipaddress.ip_network("10.0.0.2/32"),),\n        allow_direct_loopback=False,\n    )\n    assert security.is_secure_transport("10.0.0.2", ["https"])\n    assert not security.is_secure_transport("10.0.0.3", ["https"])\n    assert not security.is_secure_transport("10.0.0.2", ["http"])\n    assert not security.is_secure_transport("10.0.0.2", ["https", "https"])\n    assert not security.is_secure_transport("127.0.0.1", None)\n\n\ndef test_https_runtime_auth_requires_trusted_proxy(tmp_path: Path) -> None:\n    environment = {\n        "SPOTIFY_CLIENT_ID": "client-id",\n        "NEWS_PLAYLIST_EXTERNAL_URL": "https://news.example.test",\n        "NEWS_PLAYLIST_ADMIN_PASSWORD": "long-enough-admin-password",\n    }\n    with pytest.raises(RuntimeError, match="TRUSTED_PROXY_CIDRS"):\n        build_runtime_auth(tmp_path, environ=environment)\n    environment["NEWS_PLAYLIST_TRUSTED_PROXY_CIDRS"] = "127.0.0.1/32"\n    admin, spotify = build_runtime_auth(tmp_path, environ=environment)\n    assert admin is not None\n    assert spotify is not None\n    assert admin.is_secure_transport("127.0.0.1", ["https"])\n    assert not admin.is_secure_transport("127.0.0.1", None)\n\n\ndef test_direct_http_admin_is_rejected_before_basic_challenge(tmp_path: Path) -> None:\n    import ipaddress\n\n    HealthHandler.data_dir = tmp_path\n    HealthHandler.admin_security = AdminSecurity(\n        "long-enough-admin-password",\n        trusted_proxy_networks=(ipaddress.ip_network("10.0.0.2/32"),),\n        allow_direct_loopback=False,\n    )\n    server = HTTPServer(("127.0.0.1", 0), HealthHandler)\n    thread = _serve_one(server)\n    try:\n        with pytest.raises(urllib.error.HTTPError) as raised:\n            urllib.request.urlopen(\n                f"http://127.0.0.1:{server.server_port}/admin/", timeout=2\n            )\n        assert raised.value.code == HTTPStatus.FORBIDDEN\n        assert raised.value.headers.get("WWW-Authenticate") is None\n    finally:\n        thread.join(timeout=2)\n        server.server_close()\n\n\ndef test_admin_form_size_and_csrf_replay_fail_closed(tmp_path: Path) -> None:\n    password = "long-enough-admin-password"\n    HealthHandler.data_dir = tmp_path\n    HealthHandler.admin_security = AdminSecurity(password)\n    HealthHandler.spotify_auth = SpotifyAuthService(\n        client_id="client-id",\n        redirect_uri="https://news.example.test/admin/spotify/callback",\n        store=SpotifyCredentialStore(tmp_path / "spotify-auth.json"),\n        transport=_FakeTokenTransport(),\n    )\n    server = HTTPServer(("127.0.0.1", 0), HealthHandler)\n    base_url = f"http://127.0.0.1:{server.server_port}"\n    try:\n        oversized = b"x" * (runtime._MAX_FORM_BYTES + 1)\n        request = urllib.request.Request(\n            f"{base_url}/admin/spotify/connect",\n            data=oversized,\n            headers={\n                "Authorization": _basic_header(password),\n                "Content-Type": "application/x-www-form-urlencoded",\n            },\n            method="POST",\n        )\n        thread = _serve_one(server)\n        try:\n            with pytest.raises(urllib.error.HTTPError) as raised:\n                urllib.request.urlopen(request, timeout=2)\n            assert raised.value.code == HTTPStatus.BAD_REQUEST\n        finally:\n            thread.join(timeout=2)\n\n        security = HealthHandler.admin_security\n        assert security is not None\n        csrf = security.issue_csrf_token()\n        form = urllib.parse.urlencode({"csrf_token": csrf}).encode()\n        for expected in (HTTPStatus.SEE_OTHER, HTTPStatus.FORBIDDEN):\n            request = urllib.request.Request(\n                f"{base_url}/admin/spotify/connect",\n                data=form,\n                headers={\n                    "Authorization": _basic_header(password),\n                    "Content-Type": "application/x-www-form-urlencoded",\n                },\n                method="POST",\n            )\n            thread = _serve_one(server)\n            try:\n                if expected is HTTPStatus.SEE_OTHER:\n                    assert _no_redirect_open(request).code == expected\n                else:\n                    with pytest.raises(urllib.error.HTTPError) as raised:\n                        urllib.request.urlopen(request, timeout=2)\n                    assert raised.value.code == expected\n            finally:\n                thread.join(timeout=2)\n    finally:\n        server.server_close()\n'''
              runtime_tests.write_text(rt)

          spotify_tests = Path('tests/test_spotify_auth.py')
          st = spotify_tests.read_text()
          if 'test_callback_expiry_and_success_replay_fail_closed' not in st:
              st += '''\n\ndef test_callback_expiry_and_success_replay_fail_closed(tmp_path: Path) -> None:\n    service, transport, store = _service(tmp_path)\n    _, state = _start(service)\n    query = urllib.parse.urlencode({"state": state, "code": "authorization-code"})\n    with pytest.raises(SpotifyOAuthCallbackError, match="expired"):\n        service.complete_callback(query, now=NOW + auth._AUTHORIZATION_TTL + timedelta(seconds=1))\n    assert transport.exchange_calls == []\n    assert not store.path.exists()\n\n    service, transport, store = _service(tmp_path)\n    _, state = _start(service)\n    query = urllib.parse.urlencode({"state": state, "code": "authorization-code"})\n    service.complete_callback(query, now=NOW)\n    original = store.path.read_bytes()\n    with pytest.raises(SpotifyOAuthCallbackError, match="No Spotify authorization"):\n        service.complete_callback(query, now=NOW)\n    assert len(transport.exchange_calls) == 1\n    assert store.path.read_bytes() == original\n\n\ndef test_failed_callback_does_not_expose_secret_sentinels(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch, capsys: pytest.CaptureFixture[str]\n) -> None:\n    verifier_secret = "verifier-SENTINEL-do-not-log"\n    code_secret = "code-SENTINEL-do-not-log"\n    access_secret = "access-SENTINEL-do-not-log"\n    refresh_secret = "refresh-SENTINEL-do-not-log"\n    monkeypatch.setattr(auth, "create_code_verifier", lambda: verifier_secret)\n    transport = _FakeTransport()\n    transport.exchange_response = TokenResponse(\n        access_token=access_secret,\n        expires_in=3600,\n        granted_scopes=PRODUCTION_SCOPES,\n        refresh_token=refresh_secret,\n    )\n    store = _FailingStore(tmp_path / auth.SPOTIFY_AUTH_FILENAME)\n    service, _, _ = _service(tmp_path, transport=transport, store=store)\n    _, state = _start(service)\n    with pytest.raises(SpotifyCredentialStoreError) as raised:\n        service.complete_callback(\n            urllib.parse.urlencode({"state": state, "code": code_secret}), now=NOW\n        )\n    captured = capsys.readouterr()\n    exposed = str(raised.value) + captured.out + captured.err\n    for secret in (verifier_secret, code_secret, access_secret, refresh_secret):\n        assert secret not in exposed\n\n\ndef test_invalid_grant_marker_failure_discards_stale_active_credential(tmp_path: Path) -> None:\n    class MarkerFailingStore(SpotifyCredentialStore):\n        def save(self, record: SpotifyCredentialRecord) -> None:\n            if record.status is CredentialStatus.REAUTH_REQUIRED:\n                raise SpotifyCredentialStoreError("simulated marker persistence failure")\n            super().save(record)\n\n    store = MarkerFailingStore(tmp_path / auth.SPOTIFY_AUTH_FILENAME)\n    first, _, _ = _service(tmp_path, store=store)\n    _authorize(first)\n    transport = _FakeTransport()\n    transport.refresh_error = SpotifyTokenEndpointError(\n        "Spotify token endpoint rejected the request (HTTP 400)",\n        status=400,\n        error_code="invalid_grant",\n    )\n    restarted = SpotifyAuthService(\n        client_id="client-id", redirect_uri=REDIRECT_URI, store=store, transport=transport\n    )\n    with pytest.raises(SpotifyReauthorizationRequired):\n        restarted.get_access_token(now=NOW)\n    assert restarted.authorization_state() is AuthorizationState.REAUTH_REQUIRED\n    assert not store.path.exists()\n\n    after_restart = SpotifyAuthService(\n        client_id="client-id",\n        redirect_uri=REDIRECT_URI,\n        store=SpotifyCredentialStore(store.path),\n        transport=_FakeTransport(),\n    )\n    assert after_restart.authorization_state() is AuthorizationState.DISCONNECTED\n'''
              spotify_tests.write_text(st)
          PY
      - name: Validate changes
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          mypy src
          pytest
      - name: Commit validated changes and remove helper workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-coderabbit-fixes.yml .github/workflows/apply-coderabbit-fixes-v2.yml
          git add src/news_bulletin_playlist/runtime.py src/news_bulletin_playlist/spotify/auth.py tests/test_runtime.py tests/test_spotify_auth.py
          git commit -m "security: address CodeRabbit OAuth review"
          git push origin HEAD:feat/19-production-spotify-oauth
