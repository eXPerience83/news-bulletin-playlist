name: Temporary duration policy full-suite fixtures

on:
  push:
    branches:
      - feat/54-duration-policy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/54-duration-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]'
      - name: Supply destination duration in legacy valid-match fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'tests/test_edition_time_ordering.py',
              '''            spotify_episode_uri=f"spotify:episode:{edition.source_id}-{edition.source_native_id}",\n            diagnostics="matched",\n            updated_at=NOW,\n''',
              '''            spotify_episode_uri=f"spotify:episode:{edition.source_id}-{edition.source_native_id}",\n            spotify_duration_seconds=60,\n            diagnostics="matched",\n            updated_at=NOW,\n''',
              'edition ordering match helper',
          )
          replace_once(
              'tests/test_edition_time_ordering.py',
              '''        spotify_episode_uri="spotify:episode:late-canonical",\n        diagnostics="matched",\n        updated_at=NOW,\n''',
              '''        spotify_episode_uri="spotify:episode:late-canonical",\n        spotify_duration_seconds=60,\n        diagnostics="matched",\n        updated_at=NOW,\n''',
              'edition ordering durable fixture',
          )
          replace_once(
              'tests/test_rne_delayed_spotify_release.py',
              '''        spotify_episode_uri="spotify:episode:ser-2000",\n        diagnostics="matched",\n        updated_at=now,\n''',
              '''        spotify_episode_uri="spotify:episode:ser-2000",\n        spotify_duration_seconds=60,\n        diagnostics="matched",\n        updated_at=now,\n''',
              'RNE chronology SER fixture',
          )
          PY
      - name: Validate complete repository
        run: |
          ruff check .
          ruff format --check .
          mypy src
          pytest -q
      - name: Commit fixture compatibility
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_edition_time_ordering.py tests/test_rne_delayed_spotify_release.py
          git commit -m 'test(policy): provide destination duration for valid matches'
          git push origin HEAD:feat/54-duration-policy
