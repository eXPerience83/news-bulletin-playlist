name: Apply #208 shadow-state fix

on:
  push:
    branches:
      - perf/208-pending-not-before

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/208-pending-not-before
      - name: Preserve unsafe shadow attribution on optional read failure
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/news_bulletin_playlist/engine.py')
          text = path.read_text()
          old = '''                except PersistenceError:\n                    # This read exists only to authorize the optional 60-second local deferral.\n                    # If it is unavailable, preserve the pre-existing conservative provider flow\n                    # instead of turning an optimization lookup into a destination failure.\n                    pending = None\n'''
          new = '''                except PersistenceError:\n                    # This read exists only to authorize the optional 60-second local deferral.\n                    # If it is unavailable, preserve the pre-existing conservative provider flow\n                    # while retaining the shadow planner's fail-closed diagnostic state.\n                    self._planner_shadow = PlannerShadowResult.unsafe()\n                    pending = None\n'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/news_bulletin_playlist/engine.py
          git commit -m "Preserve unsafe shadow state on pending read failure"
          git push origin HEAD:perf/208-pending-not-before
