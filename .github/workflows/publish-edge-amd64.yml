name: Publish edge AMD64

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "README.md"
      - "LICENSE"
      - "assets/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/publish-edge-amd64.yml"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-edge-amd64
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/experience83/news-bulletin-playlist

jobs:
  publish-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require main branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: edge may only be published from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Validate configuration
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config --quiet
          docker compose -f deploy/truenas.yaml config --quiet

      - name: Build exact edge candidate
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=edge" \
            --tag news-bulletin-playlist:edge-candidate \
            .

      - name: Smoke test exact edge candidate
        run: |
          set -euo pipefail
          docker volume create news-bulletin-edge-data
          docker run --detach --rm \
            --name news-bulletin-playlist-edge \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18790:8080 \
            --mount source=news-bulletin-edge-data,target=/data \
            news-bulletin-playlist:edge-candidate

          remaining=20
          while [ "$remaining" -gt 0 ]; do
            status="$(docker inspect --format '{{.State.Health.Status}}' news-bulletin-playlist-edge)"
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              docker logs news-bulletin-playlist-edge
              exit 1
            fi
            remaining=$((remaining - 1))
            sleep 1
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' news-bulletin-playlist-edge)" = healthy
          curl --fail --silent --show-error http://127.0.0.1:18790/ | grep -q 'News Bulletin Playlists'
          curl --fail --silent --show-error http://127.0.0.1:18790/healthz | grep -q '"status":"ok"'

      - name: Stop edge candidate
        if: always()
        run: |
          docker stop news-bulletin-playlist-edge 2>/dev/null || true
          docker volume rm news-bulletin-edge-data 2>/dev/null || true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Publish edge tags
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}"
          for tag in edge edge-amd64 "sha-${GITHUB_SHA}"; do
            docker tag news-bulletin-playlist:edge-candidate "${image}:${tag}"
            docker push "${image}:${tag}"
          done

          digest="$(docker buildx imagetools inspect "${image}:edge" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid edge digest: $digest" >&2
            exit 1
          fi
          for tag in edge edge-amd64 "sha-${GITHUB_SHA}"; do
            actual="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [[ "$actual" != "$digest" ]]; then
              echo "ERROR: ${image}:${tag} resolved to $actual instead of $digest" >&2
              exit 1
            fi
          done
