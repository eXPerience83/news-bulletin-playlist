name: Temporary duration policy integration

on:
  push:
    branches:
      - feat/54-duration-policy

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/54-duration-policy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]'
      - name: Integrate duration policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1))

          # Managed catalog policy is inherited, never copied into local managed-state JSON.
          replace_once(
              'src/news_bulletin_playlist/managed_state.py',
              '                ordering=template.ordering,\n            )\n',
              '                ordering=template.ordering,\n                duration_policy=template.duration_policy,\n            )\n',
              'managed policy compile',
          )

          # Legacy YAML/configuration path supports the same bounded policy contract.
          replace_once(
              'src/news_bulletin_playlist/config.py',
              'import re\n',
              'import re\nfrom datetime import time\n',
              'config time import',
          )
          replace_once(
              'src/news_bulletin_playlist/config.py',
              '    DestinationReference,\n',
              '    DestinationReference,\n    DurationPolicy,\n    DurationPolicyException,\n',
              'config model imports',
          )
          replace_once(
              'src/news_bulletin_playlist/config.py',
              '_YAML_BOOLEAN_RE = re.compile(r"^(?:true|false)$", re.IGNORECASE)\n',
              '_YAML_BOOLEAN_RE = re.compile(r"^(?:true|false)$", re.IGNORECASE)\n_CLOCK_TIME_RE = re.compile(r"^(?:[01]\\d|2[0-3]):[0-5]\\d$")\n',
              'config clock regex',
          )
          replace_once(
              'src/news_bulletin_playlist/config.py',
              '            "ordering",\n        },\n',
              '            "ordering",\n            "duration_policy",\n        },\n',
              'config playlist key',
          )
          replace_once(
              'src/news_bulletin_playlist/config.py',
              '        max_episodes=max_episodes,\n        ordering=ordering,\n    )\n\n\ndef _parse_destination',
              '        max_episodes=max_episodes,\n        ordering=ordering,\n        duration_policy=_parse_duration_policy(\n            data.get("duration_policy"), f"{path}.duration_policy"\n        ),\n    )\n\n\ndef _parse_duration_policy(value: object, path: str) -> DurationPolicy:\n    if value is None:\n        return DurationPolicy()\n    data = _mapping(value, path)\n    _known_keys(data, {"default_max_seconds", "exceptions"}, path)\n    default_max = _positive_integer(\n        data.get("default_max_seconds", 480), f"{path}.default_max_seconds"\n    )\n    raw_exceptions = _sequence(data.get("exceptions", ()), f"{path}.exceptions")\n    exceptions: list[DurationPolicyException] = []\n    for index, raw in enumerate(raw_exceptions):\n        exception_path = f"{path}.exceptions[{index}]"\n        item = _mapping(raw, exception_path)\n        _known_keys(\n            item,\n            {"id", "source_id", "edition_local_time", "max_seconds"},\n            exception_path,\n        )\n        clock_text = _string(\n            _required(item, "edition_local_time", exception_path),\n            f"{exception_path}.edition_local_time",\n        )\n        if _CLOCK_TIME_RE.fullmatch(clock_text) is None:\n            raise ConfigError(\n                f"{exception_path}.edition_local_time: expected HH:MM in 24-hour time"\n            )\n        hour, minute = (int(part) for part in clock_text.split(":", 1))\n        max_seconds = _positive_integer(\n            _required(item, "max_seconds", exception_path),\n            f"{exception_path}.max_seconds",\n        )\n        if max_seconds <= default_max:\n            raise ConfigError(\n                f"{exception_path}.max_seconds: must exceed duration policy default"\n            )\n        exceptions.append(\n            DurationPolicyException(\n                id=_identifier(_required(item, "id", exception_path), f"{exception_path}.id"),\n                source_id=SourceId(\n                    _identifier(\n                        _required(item, "source_id", exception_path),\n                        f"{exception_path}.source_id",\n                    )\n                ),\n                edition_local_time=time(hour, minute),\n                max_seconds=max_seconds,\n            )\n        )\n    try:\n        return DurationPolicy(\n            default_max_seconds=default_max,\n            exceptions=tuple(exceptions),\n        )\n    except ValueError as exc:\n        raise ConfigError(f"{path}: {exc}") from exc\n\n\ndef _parse_destination',
              'config duration parser',
          )
          replace_once(
              'src/news_bulletin_playlist/config.py',
              '            if playlist.enabled and not source.enabled:\n                raise ConfigError(\n                    f"{path}: enabled playlist references disabled source {source_id!r}"\n                )\n\n\ndef _validate_unique_enabled_destinations',
              '            if playlist.enabled and not source.enabled:\n                raise ConfigError(\n                    f"{path}: enabled playlist references disabled source {source_id!r}"\n                )\n        for exception_index, exception in enumerate(playlist.duration_policy.exceptions):\n            exception_path = (\n                f"{origin}.playlists[{playlist_index}].duration_policy."\n                f"exceptions[{exception_index}].source_id"\n            )\n            if exception.source_id not in by_id:\n                raise ConfigError(\n                    f"{exception_path}: unknown source {exception.source_id!r}"\n                )\n\n\ndef _validate_unique_enabled_destinations',
              'config exception source validation',
          )

          # Store -> desired state supplies source timezones for local-time selectors.
          replace_once(
              'src/news_bulletin_playlist/reconciliation.py',
              'from collections.abc import Sequence\n',
              'from collections.abc import Mapping, Sequence\n',
              'reconciliation mapping import',
          )
          replace_once(
              'src/news_bulletin_playlist/reconciliation.py',
              'from typing import Any, Protocol\n',
              'from typing import Any, Protocol\nfrom zoneinfo import ZoneInfo\n',
              'reconciliation timezone import',
          )
          replace_once(
              'src/news_bulletin_playlist/reconciliation.py',
              '    *,\n    now: datetime,\n) -> DesiredPlaylistState:\n',
              '    *,\n    now: datetime,\n    source_timezones: Mapping[SourceId, ZoneInfo] | None = None,\n) -> DesiredPlaylistState:\n',
              'reconciliation builder signature',
          )
          replace_once(
              'src/news_bulletin_playlist/reconciliation.py',
              '    return build_playlist_desired_state(playlist, editions, matches, now=observed_at)\n',
              '    return build_playlist_desired_state(\n        playlist,\n        editions,\n        matches,\n        now=observed_at,\n        source_timezones=source_timezones,\n    )\n',
              'reconciliation builder delegation',
          )

          # Engine supplies the canonical source timezone map and carries decisions to observability.
          replace_once(
              'src/news_bulletin_playlist/engine.py',
              'from news_bulletin_playlist.desired_state import DesiredStateError\n',
              'from news_bulletin_playlist.desired_state import (\n    DesiredStateError,\n    DurationEligibilityDecision,\n)\n',
              'engine desired imports',
          )
          replace_once(
              'src/news_bulletin_playlist/engine.py',
              '    last_success_at: datetime | None\n    error: str | None = None\n\n\n@dataclass(frozen=True, slots=True)\nclass EngineCycleResult',
              '    last_success_at: datetime | None\n    error: str | None = None\n    duration_decisions: tuple[DurationEligibilityDecision, ...] = ()\n\n\n@dataclass(frozen=True, slots=True)\nclass EngineCycleResult',
              'engine playlist decisions field',
          )
          # Every desired-state build in EngineRunner gets source timezones.
          engine_path = Path('src/news_bulletin_playlist/engine.py')
          engine = engine_path.read_text()
          engine = engine.replace(
              '                        now=playlist_started_at,\n                    )',
              '                        now=playlist_started_at,\n                        source_timezones=self._source_timezones(),\n                    )',
          )
          engine = engine.replace(
              '                    now=playlist_started_at,\n                )',
              '                    now=playlist_started_at,\n                    source_timezones=self._source_timezones(),\n                )',
          )
          engine = engine.replace(
              'desired = build_desired_state_from_store(self.store, playlist, now=attempt_at)',
              'desired = build_desired_state_from_store(\n                    self.store,\n                    playlist,\n                    now=attempt_at,\n                    source_timezones=self._source_timezones(),\n                )',
          )
          # Carry successful decisions.
          engine = engine.replace(
              '                        error=reconciled.warning,\n                    )',
              '                        error=reconciled.warning,\n                        duration_decisions=desired.duration_decisions,\n                    )',
              1,
          )
          # Unknown duration during preservation/auth diagnostic counting must not escape and must never write.
          engine = engine.replace(
              '                except PersistenceError as exc:\n                    return self._fatal_result(\n                        started_at,\n                        source_outcomes,\n                        playlist_outcomes,\n                        exc,\n                    )\n                playlist_outcomes.append(',
              '                except DesiredStateError:\n                    desired_count = 0\n                    reason = (\n                        "destination preserved because no last-known-good state is available "\n                        "for source(s): "\n                        + ", ".join(str(source_id) for source_id in unsafe_for_playlist)\n                    )\n                    playlist_finished_at = _as_utc(self.clock())\n                    self.store.record_playlist_run(\n                        playlist.id,\n                        started_at=playlist_started_at,\n                        finished_at=playlist_finished_at,\n                        ok=False,\n                        desired_count=0,\n                        applied_count=0,\n                        error=reason,\n                    )\n                    playlist_state = self.store.get_playlist_state(playlist.id)\n                except PersistenceError as exc:\n                    return self._fatal_result(\n                        started_at,\n                        source_outcomes,\n                        playlist_outcomes,\n                        exc,\n                    )\n                playlist_outcomes.append(',
              1,
          )
          # Authorization path: inability to count authoritative desired state must not mask auth failure.
          engine = engine.replace(
              '            except PersistenceError as exc:\n                return self._fatal_result(started_at, source_outcomes, playlist_outcomes, exc)\n            playlist_outcomes.append(\n                PlaylistCycleOutcome(',
              '            except DesiredStateError:\n                desired_count = 0\n                self.store.record_playlist_run(\n                    playlist.id,\n                    started_at=attempt_at,\n                    finished_at=attempt_at,\n                    ok=False,\n                    desired_count=0,\n                    applied_count=0,\n                    error=message,\n                )\n                playlist_state = self.store.get_playlist_state(playlist.id)\n            except PersistenceError as exc:\n                return self._fatal_result(started_at, source_outcomes, playlist_outcomes, exc)\n            playlist_outcomes.append(\n                PlaylistCycleOutcome(',
              1,
          )
          marker = '    def _matching_cutoff(self, now: datetime) -> datetime:\n'
          helper = '    def _source_timezones(self):  # type: ignore[no-untyped-def]\n        return {source.id: source.timezone for source in self.config.sources}\n\n'
          if marker not in engine:
              raise SystemExit('engine source timezone marker missing')
          engine = engine.replace(marker, helper + marker, 1)
          engine_path.write_text(engine)

          # Safe diagnostics allow only bounded policy labels and numeric fields.
          replace_once(
              'src/news_bulletin_playlist/diagnostics.py',
              '        "duration_ms",\n',
              '        "duration_ms",\n        "duration_seconds",\n        "eligibility_reason",\n',
              'diagnostics duration keys',
          )
          replace_once(
              'src/news_bulletin_playlist/diagnostics.py',
              '        "matched_count",\n',
              '        "matched_count",\n        "max_seconds",\n',
              'diagnostics max key',
          )
          replace_once(
              'src/news_bulletin_playlist/diagnostics.py',
              '        "phase",\n',
              '        "phase",\n        "policy_exception",\n',
              'diagnostics exception key',
          )
          replace_once(
              'src/news_bulletin_playlist/diagnostics.py',
              '    "match_reason": frozenset(\n',
              '    "eligibility_reason": frozenset(\n        {\n            "duration_exception",\n            "duration_exceeds_default_max",\n            "duration_exceeds_exception_max",\n            "duration_metadata_unavailable",\n        }\n    ),\n    "policy_exception": frozenset({"ser_morning_0800"}),\n    "match_reason": frozenset(\n',
              'diagnostics eligibility values',
          )

          # Classify unknown destination duration without logging arbitrary source/native ids.
          replace_once(
              'src/news_bulletin_playlist/reconciliation_diagnostics.py',
              '    write_decision: str | None = None\n',
              '    write_decision: str | None = None\n    eligibility_reason: str | None = None\n',
              'failure eligibility field',
          )
          replace_once(
              'src/news_bulletin_playlist/reconciliation_diagnostics.py',
              '            ("write_decision", self.write_decision),\n',
              '            ("write_decision", self.write_decision),\n            ("eligibility_reason", self.eligibility_reason),\n',
              'failure eligibility details',
          )
          replace_once(
              'src/news_bulletin_playlist/reconciliation_diagnostics.py',
              '    operation_match = _OPERATION_FAILURE.match(error)\n',
              '    if error.startswith("desired state Spotify duration unavailable"):\n        return ReconciliationFailureDiagnostic(\n            "desired_state_error",\n            "desired_state",\n            verification_outcome="failed",\n            write_decision="blocked",\n            eligibility_reason="duration_metadata_unavailable",\n        )\n\n    operation_match = _OPERATION_FAILURE.match(error)\n',
              'unknown duration classification',
          )

          # Emit only non-default decisions to keep the bounded event stream useful.
          replace_once(
              'src/news_bulletin_playlist/engine_observability.py',
              'from news_bulletin_playlist.diagnostics import DiagnosticSeverity\n',
              'from news_bulletin_playlist.diagnostics import DiagnosticSeverity\nfrom news_bulletin_playlist.desired_state import (\n    DURATION_EXCEPTION,\n    DURATION_EXCEEDS_DEFAULT_MAX,\n    DURATION_EXCEEDS_EXCEPTION_MAX,\n)\n',
              'observability duration imports',
          )
          replace_once(
              'src/news_bulletin_playlist/engine_observability.py',
              '            self.diagnostics.emit(\n                occurred_at=result.finished_at,\n                severity=severity,\n                component="playlist",\n                event_name=event_name,\n                cycle_id=cycle_id,\n                playlist_id=str(playlist.playlist_id),\n                details=details,\n            )\n\n        duration_ms = max(',
              '            self.diagnostics.emit(\n                occurred_at=result.finished_at,\n                severity=severity,\n                component="playlist",\n                event_name=event_name,\n                cycle_id=cycle_id,\n                playlist_id=str(playlist.playlist_id),\n                details=details,\n            )\n            for decision in playlist.duration_decisions:\n                if decision.reason not in {\n                    DURATION_EXCEPTION,\n                    DURATION_EXCEEDS_DEFAULT_MAX,\n                    DURATION_EXCEEDS_EXCEPTION_MAX,\n                }:\n                    continue\n                policy_details: dict[str, str | int | bool | None] = {\n                    "duration_seconds": decision.duration_seconds,\n                    "eligibility_reason": decision.reason,\n                    "max_seconds": decision.max_seconds,\n                }\n                if decision.exception_id is not None:\n                    policy_details["policy_exception"] = decision.exception_id\n                self.diagnostics.emit(\n                    occurred_at=result.finished_at,\n                    severity=DiagnosticSeverity.INFO,\n                    component="playlist.eligibility",\n                    event_name=(\n                        "duration_exception_applied"\n                        if decision.accepted\n                        else "duration_episode_excluded"\n                    ),\n                    cycle_id=cycle_id,\n                    source_id=str(decision.source_id),\n                    playlist_id=str(playlist.playlist_id),\n                    details=policy_details,\n                )\n\n        duration_ms = max(',
              'observability duration events',
          )

          # Contract documentation.
          architecture = Path('docs/ARCHITECTURE.md')
          architecture.write_text(architecture.read_text() + '''\n\n## Bulletin duration eligibility\n\nDuration is a common playlist eligibility policy, never provider-parser behavior. The\ndefault destination-side ceiling is 480 seconds. A longer bulletin is eligible only\nwhen a version-controlled, bounded exception matches its source and semantic local\nedition time. The initial exception is `ser_morning_0800`: SER 08:00 in the source\ntimezone may run up to 1800 seconds. The exception is not a source-wide bypass.\n\nFinal eligibility uses the matched destination episode duration (Spotify `duration_ms`\nconverted to seconds). RSS/source duration remains diagnostic metadata only. If a\nmatched destination duration is unavailable, desired-state construction fails closed\nand reconciliation preserves the existing destination rather than treating unknown\nmetadata as an empty authoritative state. Non-default duration decisions are emitted\nto the bounded diagnostics event stream so exclusions and scoped exceptions are visible.\n\nTo add a justified recurring exception, add one stable unique rule to the built-in\nplaylist template with an existing `source_id`, exact `edition_local_time` in that\nsource's timezone, and a finite `max_seconds` greater than the default. Do not add\nsource-wide unlimited bypasses or provider-specific filtering.\n''')

          # Focused contract tests.
          Path('tests/test_duration_policy.py').write_text('''from __future__ import annotations\n\nfrom datetime import UTC, datetime, time\nfrom zoneinfo import ZoneInfo\n\nimport pytest\n\nfrom news_bulletin_playlist.catalog import BUILTIN_CATALOG\nfrom news_bulletin_playlist.config import ConfigError, parse_config\nfrom news_bulletin_playlist.desired_state import (\n    DURATION_EXCEPTION,\n    DURATION_EXCEEDS_DEFAULT_MAX,\n    DURATION_EXCEEDS_EXCEPTION_MAX,\n    DesiredStateError,\n    build_playlist_desired_state,\n)\nfrom news_bulletin_playlist.managed_state import (\n    ManagedState,\n    activate_template,\n    compile_engine_config,\n)\nfrom news_bulletin_playlist.models import (\n    AdapterId,\n    CanonicalEdition,\n    CountryCode,\n    DestinationReference,\n    DurationPolicy,\n    DurationPolicyException,\n    LanguageTag,\n    PlaylistDefinition,\n    PlaylistId,\n    SourceId,\n    SourceSelection,\n)\nfrom news_bulletin_playlist.persistence import EditionMatch, MatchStatus\n\nNOW = datetime(2026, 9, 3, 12, 0, tzinfo=UTC)\nMADRID = ZoneInfo("Europe/Madrid")\n\n\ndef _playlist() -> PlaylistDefinition:\n    return PlaylistDefinition(\n        id=PlaylistId("test"),\n        display_name="test",\n        description="test",\n        countries=(CountryCode("ES"),),\n        languages=(LanguageTag("es"),),\n        enabled=True,\n        source_selection=SourceSelection(explicit=(SourceId("ser"),)),\n        destination=DestinationReference(AdapterId("spotify"), "playlist"),\n        duration_policy=DurationPolicy(\n            exceptions=(\n                DurationPolicyException(\n                    id="ser_morning_0800",\n                    source_id=SourceId("ser"),\n                    edition_local_time=time(8, 0),\n                    max_seconds=1800,\n                ),\n            )\n        ),\n    )\n\n\ndef _edition(hour_utc: int, *, edition_at: datetime | None = None) -> CanonicalEdition:\n    semantic = edition_at if edition_at is not None else datetime(2026, 9, 3, hour_utc, tzinfo=UTC)\n    return CanonicalEdition(\n        source_id=SourceId("ser"),\n        source_native_id=f"ser-{hour_utc}",\n        title="SER bulletin",\n        published_at=datetime(2026, 9, 3, hour_utc, 2, tzinfo=UTC),\n        edition_at=semantic,\n    )\n\n\ndef _match(edition: CanonicalEdition, duration: int | None) -> EditionMatch:\n    return EditionMatch(\n        source_id=edition.source_id,\n        source_native_id=edition.source_native_id,\n        status=MatchStatus.MATCHED,\n        spotify_episode_uri=f"spotify:episode:{edition.source_native_id}",\n        diagnostics="matched",\n        updated_at=NOW,\n        spotify_duration_seconds=duration,\n    )\n\n\ndef _build(edition: CanonicalEdition, duration: int | None):\n    return build_playlist_desired_state(\n        _playlist(),\n        (edition,),\n        {edition.identity: _match(edition, duration)},\n        now=NOW,\n        source_timezones={SourceId("ser"): MADRID},\n    )\n\n\ndef test_default_ceiling_accepts_480_and_rejects_481_seconds() -> None:\n    accepted = _edition(9)\n    state = _build(accepted, 480)\n    assert state.uris == ("spotify:episode:ser-9",)\n\n    rejected = _edition(10)\n    state = _build(rejected, 481)\n    assert state.uris == ()\n    decision = state.duration_decisions[0]\n    assert decision.reason == DURATION_EXCEEDS_DEFAULT_MAX\n    assert decision.max_seconds == 480\n\n\ndef test_ser_0800_exception_uses_source_timezone_and_is_bounded() -> None:\n    # 06:00 UTC is 08:00 Europe/Madrid in September.\n    edition = _edition(6)\n    accepted = _build(edition, 1200)\n    assert accepted.uris == ("spotify:episode:ser-6",)\n    assert accepted.duration_decisions[0].reason == DURATION_EXCEPTION\n    assert accepted.duration_decisions[0].exception_id == "ser_morning_0800"\n\n    rejected = _build(edition, 1801)\n    assert rejected.uris == ()\n    assert rejected.duration_decisions[0].reason == DURATION_EXCEEDS_EXCEPTION_MAX\n    assert rejected.duration_decisions[0].max_seconds == 1800\n\n\ndef test_long_ser_non_0800_and_missing_semantic_time_do_not_match_exception() -> None:\n    seven_local = _edition(5)\n    assert _build(seven_local, 1200).duration_decisions[0].reason == (\n        DURATION_EXCEEDS_DEFAULT_MAX\n    )\n\n    no_semantic = CanonicalEdition(\n        source_id=SourceId("ser"),\n        source_native_id="no-semantic",\n        title="SER bulletin",\n        published_at=NOW,\n        edition_at=None,\n    )\n    assert _build(no_semantic, 1200).duration_decisions[0].reason == (\n        DURATION_EXCEEDS_DEFAULT_MAX\n    )\n\n\ndef test_unknown_spotify_duration_fails_closed() -> None:\n    edition = _edition(9)\n    with pytest.raises(DesiredStateError, match="Spotify duration unavailable"):\n        _build(edition, None)\n\n\ndef test_builtin_catalog_and_managed_compile_inherit_ser_exception_without_local_copy() -> None:\n    template = BUILTIN_CATALOG.playlist("spain_spanish_news")\n    exception = template.duration_policy.exceptions[0]\n    assert template.duration_policy.default_max_seconds == 480\n    assert exception.id == "ser_morning_0800"\n    assert exception.max_seconds == 1800\n\n    managed = activate_template(template, "destination")\n    state = ManagedState(playlists=(managed,))\n    compiled = compile_engine_config(BUILTIN_CATALOG, state)\n    assert compiled.playlists[0].duration_policy == template.duration_policy\n\n\ndef _config_payload(exception_source: str = "ser", exception_max: int = 1800):\n    return {\n        "schema_version": 1,\n        "sources": [\n            {\n                "id": "ser",\n                "display_name": "SER",\n                "countries": ["ES"],\n                "languages": ["es"],\n                "timezone": "Europe/Madrid",\n                "enabled": True,\n                "parser_id": "ser",\n                "endpoint_url": "https://example.invalid/feed",\n            }\n        ],\n        "playlists": [\n            {\n                "id": "test",\n                "display_name": "Test",\n                "description": "test",\n                "countries": ["ES"],\n                "languages": ["es"],\n                "enabled": True,\n                "source_selection": {"explicit": ["ser"]},\n                "destination": {"adapter_id": "spotify", "external_id": "dest"},\n                "duration_policy": {\n                    "default_max_seconds": 480,\n                    "exceptions": [\n                        {\n                            "id": "ser_morning_0800",\n                            "source_id": exception_source,\n                            "edition_local_time": "08:00",\n                            "max_seconds": exception_max,\n                        }\n                    ],\n                },\n            }\n        ],\n    }\n\n\ndef test_yaml_duration_policy_validates_bounded_exception_and_known_source() -> None:\n    parsed = parse_config(_config_payload())\n    assert parsed.playlists[0].duration_policy.exceptions[0].edition_local_time == time(8, 0)\n\n    with pytest.raises(ConfigError, match="must exceed duration policy default"):\n        parse_config(_config_payload(exception_max=480))\n    with pytest.raises(ConfigError, match="unknown source"):\n        parse_config(_config_payload(exception_source="missing"))\n''')
          PY
      - name: Format and validate focused policy surface
        run: |
          python scripts/ruff_fix.py
          ruff check .
          ruff format --check .
          mypy src
          pytest -q tests/test_duration_policy.py tests/test_config.py tests/test_managed_state.py tests/test_desired_state.py tests/test_reconciliation.py tests/test_runtime_diagnostics.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs/ARCHITECTURE.md
          git commit -m 'feat(policy): enforce bounded bulletin duration eligibility'
          git push origin HEAD:feat/54-duration-policy
      - name: Run full test suite after persisted commit
        run: pytest -q
