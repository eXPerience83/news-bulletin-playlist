name: Temporary footer normalization refinement

on:
  push:
    branches: [fix/58-idempotent-description-footer]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/58-idempotent-description-footer
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Apply refinement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/news_bulletin_playlist/managed_admin.py")
          text = path.read_text()
          old = '''        state = self.store.load()\n        current = self._managed(state, playlist_id)\n        selected_sources = self._source_ids(source_ids, allow_empty=not enabled)\n'''
          new = '''        state = self.store.load()\n        current = self._managed(state, playlist_id)\n        current_description = _playlist_description(current.description)\n        selected_sources = self._source_ids(source_ids, allow_empty=not enabled)\n'''
          assert text.count(old) == 1, "update preamble changed"
          text = text.replace(old, new)
          old = '''        metadata_changed = (\n            updated.display_name != current.display_name\n            or updated.description != current.description\n        )\n'''
          new = '''        metadata_changed = (\n            updated.display_name != current.display_name\n            or updated.description != current_description\n        )\n'''
          assert text.count(old) == 1, "metadata comparison changed"
          path.write_text(text.replace(old, new))

          path = Path("tests/test_playlist_description_footer.py")
          text = path.read_text()
          old = '''from __future__ import annotations\n\nfrom pathlib import Path\n'''
          new = '''from __future__ import annotations\n\nfrom dataclasses import replace\nfrom pathlib import Path\n'''
          assert text.count(old) == 1, "test imports changed"
          text = text.replace(old, new)
          marker = '''def test_footer_is_removed_before_description_limit_validation(tmp_path: Path) -> None:\n'''
          addition = '''def test_source_only_update_cleans_legacy_footer_without_spotify_metadata_write(\n    tmp_path: Path,\n) -> None:\n    spotify = _Spotify()\n    store = ManagedStateStore(tmp_path / "managed-state.json")\n    service = ManagedAdminService(store, client_factory=lambda _token: spotify)\n    template = BUILTIN_CATALOG.playlist("spain_spanish_news")\n    managed = service.activate(\n        template_id=template.id,\n        display_name=template.display_name,\n        description="Base editable",\n        cover_id=template.cover_id,\n        source_ids=template.default_source_ids,\n        access_token="token",\n    )\n    state = store.load()\n    contaminated = replace(\n        managed,\n        description=f"Base editable\\n\\n{PROJECT_DESCRIPTION_FOOTER}",\n    )\n    store.save(replace(state, playlists=(contaminated,)))\n\n    updated = service.update(\n        managed.id,\n        display_name=managed.display_name,\n        description=contaminated.description,\n        cover_id=managed.cover_id,\n        source_ids=managed.source_ids[:-1],\n        enabled=True,\n        access_token=None,\n    )\n\n    assert updated.description == "Base editable"\n    assert updated.source_ids == managed.source_ids[:-1]\n    assert store.load().playlists[0].description == "Base editable"\n    assert spotify.update_calls == []\n\n\n'''
          assert text.count(marker) == 1, "test insertion point changed"
          path.write_text(text.replace(marker, addition + marker))
          PY
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - name: Commit verified refinement
        if: success()
        run: |
          rm .github/workflows/tmp-refine-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/news_bulletin_playlist/managed_admin.py tests/test_playlist_description_footer.py .github/workflows/tmp-refine-footer.yml
          git commit -m "test: preserve source-only metadata behavior"
          git push origin HEAD:fix/58-idempotent-description-footer
