name: news-bulletin-playlist

services:
  app:
    build:
      context: .
    image: news-bulletin-playlist:local
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8788:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - news-bulletin-data:/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    pids_limit: 128
    stop_grace_period: 15s

volumes:
  news-bulletin-data:
