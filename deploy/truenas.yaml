name: news-bulletin-playlist

services:
  app:
    image: ghcr.io/experience83/news-bulletin-playlist@sha256:9ecd03fc4e34f5279821f365cd23fe8cefdbc597878d37e9f0c9812a79667c0d
    restart: unless-stopped
    init: true
    user: "568:568"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "0.0.0.0:8788:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - type: bind
        source: /mnt/Pool1/news-bulletin-playlist
        target: /data
        bind:
          create_host_path: false
    pids_limit: 128
    stop_grace_period: 15s

x-portals:
  - host: 0.0.0.0
    name: "Web UI"
    path: /
    port: 8788
    scheme: http
