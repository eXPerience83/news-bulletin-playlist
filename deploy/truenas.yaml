name: news-bulletin-playlist

services:
  app:
    image: ghcr.io/experience83/news-bulletin-playlist@sha256:896a259818699d9c91eb487f7dcf9e3ba70f60b197814aa5c040bb15c4105831
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8788:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - type: bind
        source: /mnt/POOL/apps/news-bulletin-playlist
        target: /data
        bind:
          create_host_path: false
    pids_limit: 128
    stop_grace_period: 15s

x-portals:
  - host: 0.0.0.0
    name: "Web UI"
    path: /
    port: 8788
    scheme: http
