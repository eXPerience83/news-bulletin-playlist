name: news-bulletin-playlist

services:
  app:
    image: ghcr.io/experience83/news-bulletin-playlist@sha256:60e3a2e75bb0d11575a513a7dcca481391ad18549d0a68635b274f8d39b3436a
    restart: unless-stopped
    init: true
    user: "568:568"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "0.0.0.0:8788:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - type: bind
        source: /mnt/Pool1/news-bulletin-playlist
        target: /data
        bind:
          create_host_path: false
    pids_limit: 128
    stop_grace_period: 15s

x-portals:
  - host: 0.0.0.0
    name: "Web UI"
    path: /
    port: 8788
    scheme: http
