[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "news-bulletin-playlist"
version = "0.0.1"
description = "Service for dynamic news bulletin playlists across countries and languages"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "news-bulletin-playlist contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/news_bulletin_playlist"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["news_bulletin_playlist"]
mypy_path = "src"
