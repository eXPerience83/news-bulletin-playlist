[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "news-bulletin-playlist"
version = "0.2.2"
description = "Service for dynamic news bulletin playlists across countries and languages"
readme = "README.md"
requires-python = ">=3.14,<3.16"
authors = [{ name = "Roberto Ribes" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = []

[project.scripts]
news-playlist = "news_bulletin_playlist.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
  "mypy>=2.3,<3",
  "PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/news_bulletin_playlist"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["news_bulletin_playlist"]
mypy_path = "src"
